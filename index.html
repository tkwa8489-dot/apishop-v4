<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apishop-v4 | Final Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { font-family: 'Kanit', sans-serif; box-sizing: border-box; }
        body { background-color: #020617; color: #e2e8f0; margin: 0; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }
        button:active { transform: scale(0.95); }
        input, textarea { outline: none; }
    </style>
</head>
<body>

    <nav class="p-4 glass sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-2" onclick="location.reload()" style="cursor:pointer">
            <div class="p-2 bg-cyan-500 rounded-lg text-white font-bold text-xs shadow-lg shadow-cyan-500/20">AS</div>
            <h1 class="text-lg font-bold uppercase tracking-tight">Apishop-v4</h1>
        </div>
        <div id="auth-zone" class="flex gap-2 text-[10px] font-bold">
            <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="text-white px-3 uppercase">Login</button>
            <button onclick="document.getElementById('reg-modal').classList.remove('hidden')" class="bg-cyan-600 px-5 py-2 rounded-full shadow-lg">REGISTER</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 max-w-6xl">
        <div id="balance-card" class="hidden mb-6 p-6 glass rounded-3xl flex justify-between items-center border-l-4 border-cyan-500 shadow-2xl">
            <div>
                <p class="text-slate-500 text-[10px] uppercase mb-1">User: <span id="user-display-name" class="text-cyan-400 font-bold"></span></p>
                <h2 class="text-3xl font-bold text-white"><span id="user-money">0</span> <span class="text-cyan-500 text-sm">฿</span></h2>
            </div>
            <div class="flex gap-2">
                <button onclick="showS('history')" class="bg-slate-800 px-4 py-2.5 rounded-2xl text-[10px] font-bold">📜 HISTORY</button>
                <button onclick="showS('topup')" class="bg-cyan-600 px-5 py-2.5 rounded-2xl text-[10px] font-bold shadow-lg">➕ TOPUP</button>
            </div>
        </div>

        <section id="home-section">
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="topup-section" class="hidden max-w-md mx-auto py-6">
            <div class="glass p-8 rounded-[40px] text-center border border-cyan-500/10 shadow-2xl">
                <h2 class="text-xl font-bold mb-6 text-cyan-400 uppercase italic">แจ้งโอนเงิน</h2>
                <div class="bg-slate-900/50 p-5 rounded-3xl mb-8 border border-white/5 shadow-inner">
                    <p class="text-[10px] text-slate-500 mb-1 uppercase tracking-widest">Wallet / PromptPay</p>
                    <p class="text-2xl font-bold text-white tracking-widest">096-998-0396</p>
                </div>
                <div class="text-left space-y-5">
                    <div>
                        <label class="text-[10px] text-slate-500 uppercase ml-2 mb-2 block">1. เลือกรูปสลิป</label>
                        <input type="file" id="slip-file" accept="image/*" class="w-full text-xs text-slate-400 bg-slate-900 p-3 rounded-2xl">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 uppercase ml-2 mb-2 block">2. จำนวนเงิน</label>
                        <input type="number" id="topup-amount" placeholder="ระบุยอดเงิน" class="w-full p-4 rounded-2xl bg-slate-900 text-white text-sm border border-white/5">
                    </div>
                </div>
                <button id="btn-submit-topup" onclick="uploadSlip()" class="w-full mt-10 py-4 rounded-2xl bg-cyan-600 font-bold shadow-lg shadow-cyan-500/20">ยืนยันการแจ้งโอน</button>
                <button onclick="showS('home')" class="mt-4 text-slate-500 text-[10px] block w-full underline italic">Cancel & Back</button>
            </div>
        </section>

        <section id="history-section" class="hidden py-4">
            <h2 class="text-xl font-bold mb-6 text-cyan-400 italic">MY ORDERS</h2>
            <div id="order-history-list" class="space-y-4"></div>
            <button onclick="showS('home')" class="mt-8 text-slate-500 text-[10px] block text-center w-full underline">Back to Shop</button>
        </section>
    </main>

    <div id="admin-panel" class="hidden fixed inset-0 bg-[#010409] z-[100] overflow-y-auto p-4 md:p-10">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-10 border-b border-white/5 pb-6">
                <h1 class="text-2xl font-bold text-red-500 tracking-tighter uppercase italic">Admin System</h1>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="bg-slate-800 px-8 py-3 rounded-2xl text-xs font-bold shadow-xl">EXIT</button>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <div class="glass p-8 rounded-[35px] border border-green-500/10">
                    <h3 class="text-green-500 font-bold mb-6 uppercase text-sm italic tracking-widest">Slip Verification</h3>
                    <div id="admin-topup-requests" class="space-y-6"></div>
                </div>

                <div class="glass p-8 rounded-[35px] border border-cyan-500/10">
                    <h3 class="text-cyan-500 font-bold mb-6 uppercase text-sm italic tracking-widest">Stock Manager</h3>
                    <div class="bg-slate-900/50 p-6 rounded-3xl space-y-4 shadow-inner border border-white/5">
                        <input type="text" id="adm-p-name" placeholder="ชื่อสินค้า/ไอดี" class="w-full p-4 rounded-2xl bg-slate-800 text-xs text-white">
                        <input type="number" id="adm-p-price" placeholder="ราคา (บาท)" class="w-full p-4 rounded-2xl bg-slate-800 text-xs text-white">
                        
                        <div class="p-4 bg-slate-800 rounded-2xl">
                            <label class="text-[10px] text-slate-500 mb-2 block uppercase">เลือกรูปสินค้าจากเครื่อง:</label>
                            <input type="file" id="adm-p-file" accept="image/*" class="text-[10px] text-slate-400">
                        </div>

                        <textarea id="adm-p-stock" placeholder="ไอดี:รหัส (1 บรรทัด ต่อ 1 ไอดี)" class="w-full p-4 rounded-2xl bg-slate-800 h-32 text-xs text-white"></textarea>
                        
                        <button id="btn-admin-add" onclick="adminAdd()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold text-sm uppercase shadow-lg shadow-cyan-500/20">อัปโหลด & เพิ่มสต็อก</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-[40px] w-full max-w-xs border-t-4 border-cyan-500 shadow-2xl">
            <h3 class="text-center font-bold mb-8 text-cyan-400 uppercase italic">Login</h3>
            <input type="text" id="l-user" placeholder="Username" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 text-white text-sm">
            <input type="password" id="l-pass" placeholder="Password" class="w-full p-4 mb-8 rounded-2xl bg-slate-900 text-white text-sm">
            <button onclick="login()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold shadow-xl uppercase">Sign In</button>
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="w-full mt-4 text-slate-500 text-[10px] uppercase underline italic">Close</button>
        </div>
    </div>

    <div id="reg-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-[40px] w-full max-w-xs border-t-4 border-cyan-500 shadow-2xl">
            <h3 class="text-center font-bold mb-8 text-cyan-400 uppercase italic">Register</h3>
            <input type="text" id="r-user" placeholder="Username" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 text-white text-sm">
            <input type="password" id="r-pass1" placeholder="Password" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 text-white text-sm">
            <input type="password" id="r-pass2" placeholder="Confirm Password" class="w-full p-4 mb-8 rounded-2xl bg-slate-900 text-white text-sm">
            <button onclick="register()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold shadow-xl uppercase">Create Account</button>
            <button onclick="document.getElementById('reg-modal').classList.add('hidden')" class="w-full mt-4 text-slate-500 text-[10px] uppercase underline italic">Close</button>
        </div>
    </div>

    <div id="success-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[400] p-4">
        <div class="glass p-10 rounded-[40px] w-full max-w-xs text-center border-t-4 border-green-500 shadow-2xl">
            <h3 class="font-bold mb-3 text-green-400 text-xl italic uppercase">Success! ✅</h3>
            <p class="text-[10px] text-slate-500 mb-6 uppercase">คัดลอกรหัสเข้าเกมด้านล่าง</p>
            <input type="text" id="acc-out" readonly class="w-full bg-slate-900 p-5 rounded-2xl text-cyan-400 font-bold text-center mb-8 border border-white/5">
            <button onclick="copyAcc()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold shadow-xl uppercase">Copy Credentials</button>
            <button onclick="document.getElementById('success-modal').classList.add('hidden')" class="mt-6 text-slate-500 text-xs underline uppercase italic">Close</button>
        </div>
    </div>

    <script>
        // --- Firebase Config (อย่าลืมเปลี่ยนเป็นของตัวเองถ้ามีอันใหม่) ---
        var firebaseConfig = {
          apiKey: "AIzaSyD9c6XQkaxfimS6z3iIg5dh2filSsZ9fR8",
          authDomain: "apishop-c68d5.firebaseapp.com",
          projectId: "apishop-c68d5",
          storageBucket: "apishop-c68d5.firebasestorage.app",
          messagingSenderId: "1036199268260",
          appId: "1:1036199268260:web:ca385d7ccc7e321296fb31",
          databaseURL: "https://apishop-c68d5-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();
        var IMGBB_API_KEY = "37a72c1c69996d98d40787e997a02c81"; 

        var currentUser = null;

        // --- Core Functions ---
        window.login = function() {
            var u = document.getElementById('l-user').value.trim();
            var p = document.getElementById('l-pass').value;
            if(!u || !p) return alert('กรอกข้อมูลให้ครบครับ');

            if(u === 'Apishop' && p === 'Apishop100955') {
                var k = prompt("Master Key:");
                if(k === "100955") { 
                    document.getElementById('admin-panel').classList.remove('hidden'); 
                    document.getElementById('login-modal').classList.add('hidden'); 
                    return;
                }
            }

            db.ref('users/' + u).once('value', snap => {
                var d = snap.val();
                if(d && d.password === p) {
                    currentUser = { ...d, username: u };
                    updateUI();
                    document.getElementById('login-modal').classList.add('hidden');
                } else alert('ชื่อหรือรหัสผ่านไม่ถูกต้อง');
            });
        };

        window.register = function() {
            var u = document.getElementById('r-user').value.trim();
            var p1 = document.getElementById('r-pass1').value;
            var p2 = document.getElementById('r-pass2').value;
            if(!u || !p1 || p1 !== p2) return alert('รหัสผ่านไม่ตรงกัน');
            db.ref('users/' + u).once('value', s => {
                if(s.exists()) return alert('มีชื่อนี้ในระบบแล้ว');
                db.ref('users/' + u).set({ password: p1, balance: 0 }).then(() => {
                    alert('สมัครสมาชิกสำเร็จ!');
                    document.getElementById('reg-modal').classList.add('hidden');
                });
            });
        };

        function updateUI() {
            if(!currentUser) return;
            db.ref('users/' + currentUser.username).on('value', snap => {
                var d = snap.val();
                if(!d) return;
                document.getElementById('balance-card').classList.remove('hidden');
                document.getElementById('user-money').innerText = d.balance || 0;
                document.getElementById('user-display-name').innerText = currentUser.username;
                document.getElementById('auth-zone').innerHTML = '<div class="flex items-center gap-3"><span class="text-cyan-400 font-bold uppercase">' + currentUser.username + '</span><button onclick="location.reload()" class="bg-red-500/20 text-red-500 px-3 py-1 rounded-lg">OUT</button></div>';
            });
        }

        window.showS = function(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
            if(id === 'history') renderHistory();
        };

        // --- ระบบอัปโหลดรูป (ImageBB) ---
        async function uploadFile(file) {
            var formData = new FormData();
            formData.append('image', file);
            var res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData });
            var d = await res.json();
            return d.success ? d.data.url : null;
        }

        // --- ระบบแจ้งโอน ---
        window.uploadSlip = async function() {
            var f = document.getElementById('slip-file').files[0];
            var a = document.getElementById('topup-amount').value;
            if(!f || !a || !currentUser) return alert('กรุณาแนบสลิปและระบุยอดเงิน');
            
            document.getElementById('btn-submit-topup').innerText = "กำลังส่งข้อมูล...";
            document.getElementById('btn-submit-topup').disabled = true;

            var url = await uploadFile(f);
            if(url) {
                db.ref('topup_requests/' + Date.now()).set({ username: currentUser.username, amount: parseInt(a), slip: url, date: new Date().toLocaleString() });
                alert('ส่งข้อมูลให้แอดมินแล้ว รอตรวจสอบครับ');
                showS('home');
            } else alert('อัปโหลดล้มเหลว');
            
            document.getElementById('btn-submit-topup').innerText = "ยืนยันการแจ้งโอน";
            document.getElementById('btn-submit-topup').disabled = false;
        };

        // --- ระบบแอดมิน: เติมสต็อกสินค้า ---
        window.adminAdd = async function() {
            var n = document.getElementById('adm-p-name').value;
            var p = parseInt(document.getElementById('adm-p-price').value);
            var f = document.getElementById('adm-p-file').files[0];
            var s = document.getElementById('adm-p-stock').value.split('\n').filter(l => l.trim() !== "");

            if(!n || !p || !f || s.length === 0) return alert('กรอกข้อมูลสินค้าให้ครบ (ชื่อ, ราคา, เลือกรูป, สต็อก)');

            var btn = document.getElementById('btn-admin-add');
            btn.innerText = "กำลังอัปโหลดรูปสินค้า..."; btn.disabled = true;

            var imgUrl = await uploadFile(f);
            if(imgUrl) {
                db.ref('products/' + Date.now()).set({ name: n, price: p, image: imgUrl, stock: s }).then(() => {
                    alert('เพิ่มสินค้าเรียบร้อย!');
                    document.getElementById('adm-p-name').value = '';
                    document.getElementById('adm-p-price').value = '';
                    document.getElementById('adm-p-stock').value = '';
                    document.getElementById('adm-p-file').value = '';
                    btn.innerText = "อัปโหลด & เพิ่มสต็อก"; btn.disabled = false;
                });
            } else {
                alert('อัปโหลดรูปไม่สำเร็จ');
                btn.innerText = "อัปโหลด & เพิ่มสต็อก"; btn.disabled = false;
            }
        };

        // --- ดึงสินค้ามาโชว์หน้าเว็บ ---
        db.ref('products').on('value', s => {
            var val = s.val();
            var products = val ? Object.keys(val).map(k => ({ ...val[k], id: k })) : [];
            document.getElementById('product-list').innerHTML = products.map(p => {
                var count = p.stock ? p.stock.length : 0;
                return '<div class="glass overflow-hidden rounded-[40px] border border-white/5 flex flex-col shadow-2xl transition hover:border-cyan-500/30">' +
                    '<img src="' + p.image + '" class="w-full h-48 object-cover">' +
                    '<div class="p-6 flex flex-col flex-grow">' +
                        '<h3 class="text-white font-bold text-sm mb-1 uppercase">' + p.name + '</h3>' +
                        '<p class="text-[10px] text-slate-500 mb-6 font-mono tracking-tighter">AVAILABILITY: ' + count + ' ACCOUNTS</p>' +
                        '<div class="flex justify-between items-center mt-auto">' +
                            '<span class="text-xl font-bold text-white italic">' + p.price + ' <span class="text-xs text-cyan-400 font-normal">฿</span></span>' +
                            '<button onclick="buyProduct(\'' + p.id + '\')" class="bg-cyan-600 px-6 py-2.5 rounded-2xl text-[10px] font-bold shadow-lg shadow-cyan-500/20 uppercase">Get Now</button>' +
                    '</div></div></div>';
            }).join('');
        });

        // --- ระบบซื้อของ ---
        window.buyProduct = function(id) {
            if(!currentUser) return alert('กรุณาล็อกอินก่อนซื้อครับ');
            db.ref('products/' + id).once('value', psnap => {
                var p = psnap.val();
                if(!p || !p.stock || p.stock.length === 0) return alert('ขออภัย สินค้าชิ้นนี้หมดแล้ว');
                db.ref('users/' + currentUser.username).once('value', usnap => {
                    var u = usnap.val();
                    if(u.balance < p.price) return alert('ยอดเงินไม่เพียงพอ กรุณาเติมเงินครับ');
                    
                    if(confirm('ต้องการซื้อ ' + p.name + ' ราคา ' + p.price + '฿ ใช่หรือไม่?')) {
                        var acc = p.stock.shift();
                        var orders = u.orders || [];
                        orders.unshift({ name: p.name, account: acc, date: new Date().toLocaleString() });

                        db.ref('products/' + id + '/stock').set(p.stock);
                        db.ref('users/' + currentUser.username).update({ balance: u.balance - p.price, orders: orders }).then(() => {
                            document.getElementById('acc-out').value = acc;
                            document.getElementById('success-modal').classList.remove('hidden');
                        });
                    }
                });
            });
        };

        // --- ระบบประวัติการซื้อ ---
        function renderHistory() {
            db.ref('users/' + currentUser.username + '/orders').on('value', s => {
                var o = s.val() || [];
                document.getElementById('order-history-list').innerHTML = o.map(x => {
                    return '<div class="glass p-6 rounded-[30px] border border-white/5 font-mono shadow-xl">' +
                        '<div class="flex justify-between items-center mb-3"><span class="text-[10px] text-slate
