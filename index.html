<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apishop - Final Fix 100%</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { font-family: 'Kanit', sans-serif; box-sizing: border-box; }
        body { background-color: #020617; color: #e2e8f0; margin: 0; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }
        button { cursor: pointer; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <nav class="p-4 glass sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-2" onclick="location.reload()">
            <div class="p-2 bg-cyan-500 rounded-lg text-white font-bold">AS</div>
            <h1 class="text-xl font-bold uppercase">Apishop</h1>
        </div>
        <div id="auth-zone" class="flex gap-2">
            <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="text-white px-3 text-xs">เข้าสู่ระบบ</button>
            <button onclick="document.getElementById('reg-modal').classList.remove('hidden')" class="bg-cyan-600 px-5 py-2 rounded-full text-xs font-bold shadow-lg">สมัครสมาชิก</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 max-w-5xl">
        <div id="balance-card" class="hidden mb-6 p-6 glass rounded-3xl flex justify-between items-center border-l-4 border-cyan-500">
            <div>
                <p class="text-slate-400 text-[10px]">ผู้ใช้งาน: <span id="user-display-name" class="text-cyan-400"></span></p>
                <h2 class="text-3xl font-bold text-white"><span id="user-money">0</span> <span class="text-cyan-500 text-sm">฿</span></h2>
            </div>
            <div class="flex gap-2">
                <button onclick="showS('history')" class="bg-slate-800 px-4 py-2 rounded-xl text-[10px]">📜 ประวัติ</button>
                <button onclick="showS('topup')" class="bg-cyan-600 px-4 py-2 rounded-xl text-[10px] font-bold">➕ เติมเงิน</button>
            </div>
        </div>

        <section id="home-section">
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="topup-section" class="hidden max-w-md mx-auto py-4">
            <div class="glass p-8 rounded-3xl text-center border border-cyan-500/20">
                <h2 class="text-xl font-bold mb-4 uppercase italic text-cyan-400">แจ้งโอนเงิน</h2>
                <div class="bg-slate-900 p-4 rounded-2xl mb-6 border border-white/5">
                    <p class="text-slate-500 text-[10px] mb-1">เบอร์วอลเล็ตแอดมิน</p>
                    <p class="text-2xl font-bold text-white tracking-widest">096-998-0396</p>
                </div>
                <div class="text-left space-y-4">
                    <label class="text-[10px] text-slate-400 uppercase">1. แนบรูปสลิป</label>
                    <input type="file" id="slip-file" accept="image/*" class="w-full text-xs text-slate-500">
                    <label class="text-[10px] text-slate-400 uppercase">2. จำนวนเงินที่โอน</label>
                    <input type="number" id="topup-amount" placeholder="ระบุยอดเงิน" class="w-full p-4 rounded-xl bg-slate-800 text-white border-none outline-none">
                </div>
                <button id="btn-submit-topup" onclick="uploadSlip()" class="w-full mt-8 py-4 rounded-2xl bg-cyan-600 font-bold shadow-lg shadow-cyan-500/20">ส่งสลิปให้แอดมินเช็ค</button>
                <button onclick="showS('home')" class="mt-4 text-slate-500 text-xs block w-full underline">ยกเลิก</button>
            </div>
        </section>

        <section id="history-section" class="hidden py-4">
            <h2 class="text-xl font-bold mb-6 italic">History</h2>
            <div id="order-history-list" class="space-y-3"></div>
            <button onclick="showS('home')" class="mt-8 text-cyan-400 text-xs block text-center w-full">← กลับหน้าหลัก</button>
        </section>
    </main>

    <div id="admin-panel" class="hidden fixed inset-0 bg-[#020617] z-[100] overflow-y-auto p-4">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
                <h1 class="text-xl font-bold text-red-500 uppercase">Admin Control</h1>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="bg-slate-800 px-6 py-2 rounded-xl text-xs font-bold text-white">ปิดหน้าแอดมิน</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-green-400 font-bold mb-4 uppercase text-xs">รายการสลิปที่ส่งมา</h3>
                    <div id="admin-topup-requests" class="space-y-4"></div>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-cyan-400 font-bold mb-4 uppercase text-xs">จัดการร้านค้า</h3>
                    <div id="admin-user-list" class="mb-6 space-y-2"></div>
                    <div class="bg-slate-900 p-4 rounded-2xl space-y-3">
                        <input type="text" id="adm-p-name" placeholder="ชื่อสินค้า" class="w-full p-3 rounded-xl bg-slate-800 text-xs text-white">
                        <input type="number" id="adm-p-price" placeholder="ราคา" class="w-full p-3 rounded-xl bg-slate-800 text-xs text-white">
                        <textarea id="adm-p-stock" placeholder="ไอดี:รหัส (1 บรรทัด ต่อ 1 อัน)" class="w-full p-3 rounded-xl bg-slate-800 h-24 text-xs text-white"></textarea>
                        <button onclick="adminAdd()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold text-xs text-white">เพิ่มสินค้า</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-xs border-t-4 border-cyan-500">
            <h3 class="text-center font-bold mb-6 italic uppercase">Login</h3>
            <input type="text" id="l-user" placeholder="Username" class="w-full p-4 mb-3 rounded-2xl bg-slate-900 text-white text-sm outline-none">
            <input type="password" id="l-pass" placeholder="Password" class="w-full p-4 mb-6 rounded-2xl bg-slate-900 text-white text-sm outline-none">
            <button onclick="login()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold text-white shadow-lg shadow-cyan-500/20">LOG IN</button>
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="w-full mt-4 text-slate-500 text-[10px] uppercase">ยกเลิก</button>
        </div>
    </div>

    <div id="reg-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-xs border-t-4 border-cyan-500">
            <h3 class="text-center font-bold mb-6 italic uppercase">Register</h3>
            <input type="text" id="r-user" placeholder="Username" class="w-full p-4 mb-3 rounded-2xl bg-slate-900 text-white text-sm outline-none">
            <input type="password" id="r-pass1" placeholder="Password" class="w-full p-4 mb-3 rounded-2xl bg-slate-900 text-white text-sm outline-none">
            <input type="password" id="r-pass2" placeholder="Confirm Password" class="w-full p-4 mb-6 rounded-2xl bg-slate-900 text-white text-sm outline-none">
            <button onclick="register()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold text-white shadow-lg shadow-cyan-500/20">SIGN UP</button>
            <button onclick="document.getElementById('reg-modal').classList.add('hidden')" class="w-full mt-4 text-slate-500 text-[10px] uppercase">ยกเลิก</button>
        </div>
    </div>

    <div id="success-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[400] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-xs text-center border-t-4 border-green-500">
            <h3 class="font-bold mb-4 text-green-400 italic">SUCCESS! ✅</h3>
            <input type="text" id="acc-out" readonly class="w-full bg-slate-900 p-4 rounded-xl text-cyan-400 font-bold text-center mb-4 font-mono">
            <button onclick="copyAcc()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold text-white">COPY</button>
            <button onclick="document.getElementById('success-modal').classList.add('hidden')" class="mt-4 text-slate-500 text-[10px] uppercase underline">ปิดหน้าต่างนี้</button>
        </div>
    </div>

    <script>
        var firebaseConfig = {
          apiKey: "AIzaSyD9c6XQkaxfimS6z3iIg5dh2filSsZ9fR8",
          authDomain: "apishop-c68d5.firebaseapp.com",
          projectId: "apishop-c68d5",
          storageBucket: "apishop-c68d5.firebasestorage.app",
          messagingSenderId: "1036199268260",
          appId: "1:1036199268260:web:ca385d7ccc7e321296fb31",
          databaseURL: "https://apishop-c68d5-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        var db = firebase.database();
        var IMGBB_API_KEY = "37a72c1c69996d98d40787e997a02c81"; 

        var users = [];
        var products = [];
        var currentUser = null;

        // DB Updates
        db.ref('users').on('value', function(snapshot) {
            var val = snapshot.val();
            users = val ? Object.keys(val).map(function(k) { return { ...val[k], username: k }; }) : [];
            if(currentUser) {
                var updated = users.find(function(u) { return u.username === currentUser.username; });
                if(updated) { currentUser = updated; updateUI(); }
            }
            renderAdmin();
        });

        db.ref('products').on('value', function(snapshot) {
            var val = snapshot.val();
            products = val ? Object.keys(val).map(function(k) { return { ...val[k], id: k }; }) : [];
            renderP();
            renderAdmin();
        });

        // Functions
        window.showS = function(id) {
            document.getElementById('home-section').classList.add('hidden');
            document.getElementById('topup-section').classList.add('hidden');
            document.getElementById('history-section').classList.add('hidden');
            document.getElementById(id + '-section').classList.remove('hidden');
            if(id === 'history') renderHistory();
        };

        window.register = function() {
            var u = document.getElementById('r-user').value.trim();
            var p1 = document.getElementById('r-pass1').value;
            var p2 = document.getElementById('r-pass2').value;
            if(!u || !p1 || p1 !== p2) return alert('กรุณากรอกข้อมูลให้ถูกต้อง');
            db.ref('users/' + u).set({ password: p1, balance: 0, orders: [] }).then(function() {
                alert('สมัครสมาชิกสำเร็จ!');
                document.getElementById('reg-modal').classList.add('hidden');
            });
        };

        window.login = function() {
            var u = document.getElementById('l-user').value.trim();
            var p = document.getElementById('l-pass').value;
            if(u === 'Apishop' && p === 'Apishop100955') {
                var k = prompt("Master Key:");
                if(k === "100955") { document.getElementById('admin-panel').classList.remove('hidden'); document.getElementById('login-modal').classList.add('hidden'); return; }
            }
            var user = users.find(function(x) { return x.username === u && x.password === p; });
            if(user) {
                currentUser = user;
                updateUI();
                document.getElementById('login-modal').classList.add('hidden');
            } else alert('ชื่อหรือรหัสผ่านผิด');
        };

        function updateUI() {
            if(!currentUser) return;
            document.getElementById('balance-card').classList.remove('hidden');
            document.getElementById('user-money').innerText = currentUser.balance;
            document.getElementById('user-display-name').innerText = currentUser.username;
            document.getElementById('auth-zone').innerHTML = '<span class="text-cyan-400 font-bold text-xs uppercase">' + currentUser.username + '</span><button onclick="location.reload()" class="ml-3 text-red-500 text-[10px] font-bold">ออก</button>';
        }

        window.uploadSlip = function() {
            if(!currentUser) return alert('กรุณาล็อกอิน');
            var fileInput = document.getElementById('slip-file');
            var amountInput = document.getElementById('topup-amount');
            if(!fileInput.files[0] || !amountInput.value) return alert('กรุณาเลือกสลิปและใส่ยอดเงิน');
            var btn = document.getElementById('btn-submit-topup');
            btn.innerText = "กำลังอัปโหลด..."; btn.disabled = true;
            var formData = new FormData();
            formData.append('image', fileInput.files[0]);
            fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if(data.success) {
                    db.ref('topup_requests/' + Date.now()).set({ username: currentUser.username, amount: parseInt(amountInput.value), slip: data.data.url, date: new Date().toLocaleString() });
                    alert('ส่งสลิปแล้ว! รอแอดมินอนุมัติ');
                    showS('home');
                } else alert('อัปโหลดล้มเหลว');
            }).finally(function() { btn.innerText = "ส่งสลิปให้แอดมินเช็ค"; btn.disabled = false; });
        };

        function renderAdmin() {
            db.ref('topup_requests').on('value', function(snapshot) {
                var reqs = snapshot.val();
                var h = '';
                if(reqs) {
                    Object.keys(reqs).forEach(function(id) {
                        var r = reqs[id];
                        h += '<div class="p-4 bg-slate-900 rounded-2xl border border-white/5 shadow-lg text-xs">' +
                            '<p class="mb-2 text-cyan-400 font-bold">' + r.username + ' | ' + r.amount + '฿</p>' +
                            '<a href="' + r.slip + '" target="_blank"><img src="' + r.slip + '" class="w-full h-24 object-cover rounded mb-2"></a>' +
                            '<button onclick="approveMoney(\'' + id + '\', \'' + r.username + '\', ' + r.amount + ')" class="w-full bg-green-600 py-2 rounded font-bold uppercase">อนุมัติ</button>' +
                        '</div>';
                    });
                }
                document.getElementById('admin-topup-requests').innerHTML = h || 'ไม่มีสลิปใหม่';
            });
            document.getElementById('admin-user-list').innerHTML = users.map(function(u) {
                return '<div class="p-2 bg-slate-900 rounded flex justify-between text-[10px] border border-white/5 mb-1"><span>' + u.username + '</span><button onclick="editMoney(\'' + u.username + '\')" class="text-yellow-500">' + u.balance + '฿</button></div>';
            }).join('');
        }

        window.approveMoney = function(reqId, uName, amt) {
            var user = users.find(function(x) { return x.username === uName; });
            if(user) { db.ref('users/' + uName + '/balance').set((user.balance || 0) + amt); db.ref('topup_requests/' + reqId).remove(); alert('เติมเงินแล้ว!'); }
        };

        window.editMoney = function(uName) {
            var m = prompt("แก้เงิน " + uName + ":");
            if (m !== null) db.ref('users/' + uName + '/balance').set(parseInt(m));
        };

        window.adminAdd = function() {
            var n = document.getElementById('adm-p-name').value;
            var p = parseInt(document.getElementById('adm-p-price').value);
            var s = document.getElementById('adm-p-stock').value.split('\n').filter(function(l) { return l.trim() !== ""; });
            if(n && p) db.ref('products/' + Date.now()).set({ name: n, price: p, stock: s }).then(function() { alert('ลงแล้ว!'); });
        };

        window.buyProduct = function(pId) {
            if(!currentUser) return alert('กรุณาล็อกอินก่อนซื้อ');
            var p = products.find(function(x) { return x.id == pId; });
            if(!p || !p.stock || p.stock.length === 0) return alert('หมด!');
            if(currentUser.balance < p.price) return alert('เงินไม่พอครับ');
            var acc = p.stock.shift();
            var orders = currentUser.orders || [];
            orders.unshift({ name: p.name, account: acc, date: new Date().toLocaleString() });
            db.ref('products/' + pId + '/stock').set(p.stock);
            db.ref('users/' + currentUser.username + '/balance').set(currentUser.balance - p.price);
            db.ref('users/' + currentUser.username + '/orders').set(orders).then(function() {
                document.getElementById('acc-out').value = acc;
                document.getElementById('success-modal').classList.remove('hidden');
            });
        };

        function renderP() {
            document.getElementById('product-list').innerHTML = products.map(function(p) {
                return '<div class="glass p-5 rounded-3xl border border-white/5 flex flex-col justify-between shadow-xl">' +
                    '<h3 class="text-white font-bold text-sm">' + p.name + '</h3>' +
                    '<p class="text-[10px] text-slate-500 mb-4 font-mono uppercase">STOCK: ' + (p.stock ? p.stock.length : 0) + '</p>' +
                    '<div class="flex justify-between items-center">' +
                        '<span class="text-lg font-bold text-white">' + p.price + ' ฿</span>' +
                        '<button onclick="buyProduct(\'' + p.id + '\')" class="bg-cyan-600 px-5 py-2 rounded-xl text-[10px] font-bold text-white uppercase shadow-lg shadow-cyan-500/20">Buy Now</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderHistory() {
            var l = document.getElementById('order-history-list');
            if(!currentUser.orders || currentUser.orders.length === 0) return l.innerHTML = '<p class="text-center text-slate-500 py-10 text-xs">ไม่มีประวัติ</p>';
            l.innerHTML = currentUser.orders.map(function(o) {
                return '<div class="glass p-5 rounded-2xl border border-white/5 font-mono text-[10px]"><p class="text-slate-500 mb-1">' + o.date + '</p><h4 class="text-white font-bold text-xs uppercase mb-2">' + o.name + '</h4><div class="p-3 bg-slate-900 rounded-xl text-cyan-400">' + o.account + '</div></div>';
            }).join('');
        }

        window.copyAcc = function() { var o = document.getElementById('acc-out'); o.select(); document.execCommand('copy'); alert('Copy OK!'); };
    </script>
</body>
                      </html>
