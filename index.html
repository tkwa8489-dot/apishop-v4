<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apishop-v4 | Market System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { font-family: 'Kanit', sans-serif; box-sizing: border-box; }
        body { background-color: #020617; color: #e2e8f0; margin: 0; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none !important; }
        button:active { transform: scale(0.95); }
        input, textarea { outline: none; border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <nav class="p-4 glass sticky top-0 z-50 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-2" onclick="location.reload()" style="cursor:pointer">
            <div class="p-2 bg-cyan-500 rounded-lg text-white font-bold text-xs shadow-lg shadow-cyan-500/30">AS</div>
            <h1 class="text-lg font-bold uppercase tracking-tight text-white">Apishop-v4</h1>
        </div>
        <div id="auth-zone" class="flex gap-2">
            <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="text-white px-3 text-[10px] font-bold uppercase">Login</button>
            <button onclick="document.getElementById('reg-modal').classList.remove('hidden')" class="bg-cyan-600 px-4 py-2 rounded-full text-[10px] font-bold shadow-lg shadow-cyan-500/20">Register</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 max-w-6xl">
        <div id="balance-card" class="hidden mb-6 p-6 glass rounded-[30px] flex justify-between items-center border-l-4 border-cyan-500 shadow-2xl">
            <div>
                <p class="text-slate-500 text-[10px] uppercase mb-1 tracking-widest font-bold">WELCOME: <span id="user-display-name" class="text-cyan-400"></span></p>
                <h2 class="text-3xl font-bold text-white"><span id="user-money">0</span> <span class="text-cyan-500 text-sm">฿</span></h2>
            </div>
            <div class="flex gap-2">
                <button onclick="showS('history')" class="bg-slate-800 px-4 py-2.5 rounded-2xl text-[10px] font-bold border border-white/5">📜 HISTORY</button>
                <button onclick="showS('topup')" class="bg-cyan-600 px-5 py-2.5 rounded-2xl text-[10px] font-bold shadow-lg shadow-cyan-500/30">➕ TOPUP</button>
            </div>
        </div>

        <section id="home-section">
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="topup-section" class="hidden max-w-md mx-auto py-6">
            <div class="glass p-8 rounded-[40px] text-center border border-cyan-500/10 shadow-2xl">
                <h2 class="text-xl font-bold mb-6 text-cyan-400 uppercase italic italic">Topup Money</h2>
                <div class="bg-slate-900/50 p-6 rounded-3xl mb-8 border border-white/5 shadow-inner">
                    <p class="text-[10px] text-slate-500 mb-1 uppercase tracking-widest font-bold">Payment Method</p>
                    <p class="text-2xl font-bold text-white tracking-widest">096-998-0396</p>
                </div>
                <div class="text-left space-y-4">
                    <div>
                        <label class="text-[10px] text-slate-500 ml-2 mb-2 block uppercase font-bold">1. แนบสลิป</label>
                        <input type="file" id="slip-file" accept="image/*" class="w-full text-xs text-slate-400 bg-slate-900 p-3 rounded-2xl">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 ml-2 mb-2 block uppercase font-bold">2. ยอดเงิน</label>
                        <input type="number" id="topup-amount" placeholder="ระบุจำนวนเงิน" class="w-full p-4 rounded-2xl bg-slate-900 text-white text-sm">
                    </div>
                </div>
                <button id="btn-submit-topup" onclick="uploadSlip()" class="w-full mt-10 py-4 rounded-2xl bg-cyan-600 font-bold shadow-lg shadow-cyan-500/30">ยืนยันและส่งสลิป</button>
                <button onclick="showS('home')" class="mt-4 text-slate-500 text-[10px] block w-full underline italic">Cancel</button>
            </div>
        </section>

        <section id="history-section" class="hidden py-4">
            <h2 class="text-xl font-bold mb-6 text-cyan-400 italic">MY ORDERS</h2>
            <div id="order-history-list" class="space-y-4"></div>
            <button onclick="showS('home')" class="mt-8 text-slate-500 text-[10px] block text-center w-full underline">Back to Shop</button>
        </section>
    </main>

    <div id="admin-panel" class="hidden fixed inset-0 bg-[#010409] z-[100] overflow-y-auto p-4 md:p-10">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-10 border-b border-white/5 pb-6">
                <h1 class="text-2xl font-bold text-red-500 tracking-tighter uppercase italic">Admin Dashboard</h1>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="bg-slate-800 px-8 py-3 rounded-2xl text-xs font-bold shadow-xl border border-white/5">CLOSE</button>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                <div class="glass p-8 rounded-[35px] border border-green-500/10">
                    <h3 class="text-green-500 font-bold mb-6 uppercase text-sm italic tracking-widest">Slip Queue</h3>
                    <div id="admin-topup-requests" class="space-y-6"></div>
                </div>

                <div class="glass p-8 rounded-[35px] border border-cyan-500/10">
                    <h3 class="text-cyan-500 font-bold mb-6 uppercase text-sm italic tracking-widest">Inventory Manager</h3>
                    <div class="bg-slate-900/50 p-6 rounded-3xl space-y-4 shadow-inner border border-white/5">
                        <input type="text" id="adm-p-name" placeholder="ชื่อสินค้า (ใส่ให้ตรงถ้าจะเติมสต็อก)" class="w-full p-4 rounded-2xl bg-slate-800 text-xs text-white">
                        <input type="number" id="adm-p-price" placeholder="ราคา (บาท)" class="w-full p-4 rounded-2xl bg-slate-800 text-xs text-white">
                        
                        <div class="p-4 bg-slate-800 rounded-2xl">
                            <label class="text-[10px] text-slate-500 mb-2 block">เปลี่ยนรูปภาพ (ไม่ใส่จะใช้รูปเดิม):</label>
                            <input type="file" id="adm-p-file" accept="image/*" class="text-[10px] text-slate-400">
                        </div>

                        <textarea id="adm-p-stock" placeholder="ไอดี:รหัส (1 บรรทัด ต่อ 1 ไอดี)" class="w-full p-4 rounded-2xl bg-slate-800 h-32 text-xs text-white"></textarea>
                        
                        <button id="btn-admin-add" onclick="adminAdd()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold text-sm uppercase shadow-lg shadow-cyan-500/30">บันทึกสต็อก</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-[40px] w-full max-w-xs border-t-4 border-cyan-500 shadow-2xl">
            <h3 class="text-center font-bold mb-8 text-cyan-400 uppercase italic">Login</h3>
            <input type="text" id="l-user" placeholder="Username" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 text-white text-sm">
            <input type="password" id="l-pass" placeholder="Password" class="w-full p-4 mb-8 rounded-2xl bg-slate-900 text-white text-sm">
            <button onclick="login()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold shadow-xl uppercase">Sign In</button>
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="w-full mt-4 text-slate-500 text-[10px] uppercase underline italic">Close</button>
        </div>
    </div>

    <div id="reg-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-[40px] w-full max-w-xs border-t-4 border-cyan-500 shadow-2xl">
            <h3 class="text-center font-bold mb-8 text-cyan-400 uppercase italic text-sm">Register Account</h3>
            <input type="text" id="r-user" placeholder="Username" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 text-white text-sm">
            <input type="password" id="r-pass1" placeholder="Password" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 text-white text-sm">
            <input type="password" id="r-pass2" placeholder="Confirm Password" class="w-full p-4 mb-8 rounded-2xl bg-slate-900 text-white text-sm">
            <button onclick="register()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold shadow-xl uppercase">Register</button>
            <button onclick="document.getElementById('reg-modal').classList.add('hidden')" class="w-full mt-4 text-slate-500 text-[10px] uppercase underline italic">Close</button>
        </div>
    </div>

    <div id="success-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[400] p-4">
        <div class="glass p-10 rounded-[40px] w-full max-w-xs text-center border-t-4 border-green-500 shadow-2xl">
            <h3 class="font-bold mb-3 text-green-400 text-xl italic uppercase">Success! ✅</h3>
            <input type="text" id="acc-out" readonly class="w-full bg-slate-900 p-5 rounded-2xl text-cyan-400 font-bold text-center mb-8 border border-white/5 select-all">
            <button onclick="copyAcc()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold shadow-xl">คัดลอกรหัส</button>
            <button onclick="document.getElementById('success-modal').classList.add('hidden')" class="mt-4 text-xs text-slate-500 underline">CLOSE</button>
        </div>
    </div>

    <script>
        // --- Firebase Config (อย่าลืมใส่ตัวจริงของมึง!) ---
        var firebaseConfig = {
          apiKey: "AIzaSyD9c6XQkaxfimS6z3iIg5dh2filSsZ9fR8",
          authDomain: "apishop-c68d5.firebaseapp.com",
          projectId: "apishop-c68d5",
          storageBucket: "apishop-c68d5.firebasestorage.app",
          messagingSenderId: "1036199268260",
          appId: "1:1036199268260:web:ca385d7ccc7e321296fb31",
          databaseURL: "https://apishop-c68d5-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();
        var IMGBB_API_KEY = "37a72c1c69996d98d40787e997a02c81"; 

        var currentUser = null;

        // --- Core Functions ---
        window.login = function() {
            var u = document.getElementById('l-user').value.trim();
            var p = document.getElementById('l-pass').value;
            if(!u || !p) return alert('กรอกให้ครบครับ');

            if(u === 'Apishop' && p === 'Apishop100955') {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('login-modal').classList.add('hidden');
                return;
            }

            db.ref('users/' + u).once('value', snap => {
                var d = snap.val();
                if(d && d.password === p) {
                    currentUser = { ...d, username: u };
                    updateUI();
                    document.getElementById('login-modal').classList.add('hidden');
                } else alert('ชื่อหรือรหัสผ่านผิด');
            });
        };

        window.register = function() {
            var u = document.getElementById('r-user').value.trim();
            var p1 = document.getElementById('r-pass1').value;
            var p2 = document.getElementById('r-pass2').value;
            if(!u || p1 !== p2) return alert('รหัสผ่านไม่ตรงกัน');
            db.ref('users/' + u).once('value', s => {
                if(s.exists()) return alert('มีชื่อนี้แล้ว');
                db.ref('users/' + u).set({ password: p1, balance: 0 }).then(() => {
                    alert('สมัครสำเร็จ!');
                    document.getElementById('reg-modal').classList.add('hidden');
                });
            });
        };

        function updateUI() {
            if(!currentUser) return;
            db.ref('users/' + currentUser.username).on('value', snap => {
                var d = snap.val();
                if(!d) return;
                document.getElementById('balance-card').classList.remove('hidden');
                document.getElementById('user-money').innerText = d.balance || 0;
                document.getElementById('user-display-name').innerText = currentUser.username;
                document.getElementById('auth-zone').innerHTML = '<span class="text-cyan-400 font-bold uppercase text-[10px]">' + currentUser.username + '</span><button onclick="location.reload()" class="ml-2 text-red-500 font-bold text-[10px]">Logout</button>';
            });
        }

        window.showS = function(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
            if(id === 'history') renderHistory();
        };

        async function uploadFile(file) {
            var formData = new FormData();
            formData.append('image', file);
            var res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData });
            var d = await res.json();
            return d.success ? d.data.url : null;
        }

        // --- แจ้งโอน (Fix สลิปหาย) ---
        window.uploadSlip = async function() {
            var f = document.getElementById('slip-file').files[0];
            var a = document.getElementById('topup-amount').value;
            if(!f || !a || !currentUser) return alert('ใส่สลิปและจำนวนเงิน');
            
            document.getElementById('btn-submit-topup').innerText = "กำลังส่ง...";
            var url = await uploadFile(f);
            if(url) {
                // ใช้ push() เพื่อสร้าง ID ใหม่เสมอ ไม่ทับของเดิม
                db.ref('topup_requests').push({
                    username: currentUser.username,
                    amount: parseInt(a),
                    slip: url,
                    time: new Date().toLocaleString()
                }).then(() => {
                    alert('ส่งสลิปให้แอดมินแล้ว!');
                    showS('home');
                });
            } else alert('อัปโหลดล้มเหลว');
            document.getElementById('btn-submit-topup').innerText = "ยืนยันและส่งสลิป";
        };

        // --- แอดมิน: เติมสต็อก (ถ้าชื่อเดิมจะบวกเพิ่มไอดี) ---
        window.adminAdd = async function() {
            var name = document.getElementById('adm-p-name').value.trim();
            var price = parseInt(document.getElementById('adm-p-price').value);
            var file = document.getElementById('adm-p-file').files[0];
            var newStock = document.getElementById('adm-p-stock').value.split('\n').filter(l => l.trim() !== "");

            if(!name || isNaN(price) || newStock.length === 0) return alert('ใส่ชื่อ ราคา และสต็อกให้ครบ');
            
            var btn = document.getElementById('btn-admin-add');
            btn.innerText = "กำลังประมวลผล..."; btn.disabled = true;

            db.ref('products').once('value', async snap => {
                var products = snap.val() || {};
                var targetId = null;
                var currentStock = [];
                var oldImg = null;

                // วนหาว่ามีสินค้าชื่อนี้ไหม
                Object.keys(products).forEach(k => {
                    if(products[k].name === name) {
                        targetId = k;
                        currentStock = products[k].stock || [];
                        oldImg = products[k].image;
                    }
                });

                var finalImg = oldImg;
                if(file) {
                    finalImg = await uploadFile(file);
                }

                if(!finalImg) {
                    alert('ต้องมีรูปสินค้า!');
                    btn.disabled = false; btn.innerText = "บันทึกสต็อก"; return;
                }

                var finalId = targetId || Date.now();
                var combinedStock = [...currentStock, ...newStock];

                db.ref('products/' + finalId).set({
                    name: name,
                    price: price,
                    image: finalImg,
                    stock: combinedStock
                }).then(() => {
                    alert('สำเร็จ! เติมสต็อก/ลงสินค้าใหม่เรียบร้อย');
                    document.getElementById('adm-p-stock').value = '';
                    btn.disabled = false; btn.innerText = "บันทึกสต็อก";
                });
            });
        };

        // --- แสดงสินค้า ---
        db.ref('products').on('value', snap => {
            var val = snap.val();
            var products = val ? Object.keys(val).map(k => ({ ...val[k], id: k })) : [];
            document.getElementById('product-list').innerHTML = products.map(p => {
                var count = p.stock ? p.stock.length : 0;
                return '<div class="glass overflow-hidden rounded-[40px] border border-white/5 flex flex-col shadow-2xl">' +
                    '<img src="' + p.image + '" class="w-full h-48 object-cover">' +
                    '<div class="p-6 flex flex-col flex-grow">' +
                        '<h3 class="text-white font-bold text-sm mb-1 uppercase tracking-tight">' + p.name + '</h3>' +
                        '<p class="text-[10px] text-slate-500 mb-6 font-mono">STOCK: ' + count + ' UNITS</p>' +
                        '<div class="flex justify-between items-center mt-auto">' +
                            '<span class="text-xl font-bold text-white italic">' + p.price + ' <span class="text-xs text-cyan-400 font-normal">฿</span></span>' +
                            '<button onclick="buyProduct(\'' + p.id + '\')" class="bg-cyan-600 px-6 py-2.5 rounded-2xl text-[10px] font-bold shadow-lg shadow-cyan-500/20 uppercase">Buy Now</button>' +
                    '</div></div></div>';
            }).join('');
        });

        window.buyProduct = function(pId) {
            if(!currentUser) return alert('กรุณาล็อกอินก่อนครับ');
            db.ref('products/' + pId).once('value', snap => {
                var p = snap.val();
                if(!p || !p.stock || p.stock.length === 0) return alert('สินค้าหมดครับ');
                db.ref('users/' + currentUser.username).once('value', usnap => {
                    var u = usnap.val();
                    if(u.balance < p.price) return alert('เงินไม่พอครับ');
                    
                    var acc = p.stock.shift();
                    var orders = u.orders || [];
                    orders.unshift({ name: p.name, account: acc, date: new Date().toLocaleString() });

                    db.ref('products/' + pId + '/stock').set(p.stock);
                    db.ref('users/' + currentUser.username).update({ balance: u.balance - p.price, orders: orders }).then(() => {
                        document.getElementById('acc-out').value = acc;
                        document.getElementById('success-modal').classList.remove('hidden');
                    });
                });
            });
        };

        function renderHistory() {
            db.ref('users/' + currentUser.username + '/orders').on('value', s => {
                var o = s.val() || [];
                document.ge
