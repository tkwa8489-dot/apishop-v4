<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apishop-v4 | Final Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { font-family: 'Kanit', sans-serif; box-sizing: border-box; }
        body { background-color: #020617; color: #f8fafc; margin: 0; min-height: 100vh; overflow-x: hidden; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .hidden { display: none !important; }
        button:active { transform: scale(0.96); transition: 0.1s; }
        input, textarea { background: #0f172a !important; color: white !important; border: 1px solid rgba(255,255,255,0.1) !important; outline: none; }
        input:focus { border-color: #06b6d4 !important; }
    </style>
</head>
<body>

    <nav class="p-4 glass sticky top-0 z-50 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-2" onclick="location.reload()" style="cursor:pointer">
            <div class="p-2 bg-gradient-to-br from-cyan-500 to-blue-600 rounded-xl text-white font-bold text-xs shadow-lg">AS</div>
            <h1 class="text-lg font-bold uppercase tracking-widest italic">Apishop-v4</h1>
        </div>
        <div id="auth-zone" class="flex gap-2">
            <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="text-white px-3 text-[10px] font-bold uppercase hover:text-cyan-400">Login</button>
            <button onclick="document.getElementById('reg-modal').classList.remove('hidden')" class="bg-cyan-600 px-5 py-2 rounded-full text-[10px] font-bold shadow-lg shadow-cyan-500/20">Register</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 max-w-6xl">
        <div id="balance-card" class="hidden mb-8 p-6 glass rounded-[32px] flex justify-between items-center border-l-8 border-cyan-500 shadow-2xl">
            <div>
                <p class="text-slate-500 text-[10px] uppercase font-bold tracking-widest mb-1">User: <span id="user-display-name" class="text-cyan-400"></span></p>
                <h2 class="text-4xl font-bold text-white tracking-tighter"><span id="user-money">0</span> <span class="text-cyan-500 text-sm">฿</span></h2>
            </div>
            <div class="flex gap-3">
                <button onclick="showS('history')" class="bg-slate-800 p-3 rounded-2xl text-[10px] font-bold border border-white/5 shadow-xl">📜 ประวัติ</button>
                <button onclick="showS('topup')" class="bg-cyan-600 px-6 py-3 rounded-2xl text-[10px] font-bold shadow-lg shadow-cyan-500/30">➕ เติมเงิน</button>
            </div>
        </div>

        <section id="home-section">
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </section>

        <section id="topup-section" class="hidden max-w-md mx-auto py-6">
            <div class="glass p-10 rounded-[48px] text-center border border-cyan-500/10 shadow-2xl">
                <h2 class="text-2xl font-bold mb-8 text-cyan-400 uppercase italic tracking-tighter">Topup Payment</h2>
                <div class="bg-slate-900 p-6 rounded-3xl mb-8 border border-white/5 shadow-inner">
                    <p class="text-[10px] text-slate-500 mb-2 uppercase font-bold tracking-widest">วอลเล็ต / พร้อมเพย์</p>
                    <p class="text-2xl font-bold text-white tracking-widest">096-998-0396</p>
                </div>
                <div class="text-left space-y-5">
                    <div>
                        <label class="text-[10px] text-slate-500 ml-2 mb-2 block font-bold">1. อัปโหลดสลิป</label>
                        <input type="file" id="slip-file" accept="image/*" class="w-full p-3 rounded-2xl bg-slate-900 text-xs">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-500 ml-2 mb-2 block font-bold">2. ระบุยอดเงิน</label>
                        <input type="number" id="topup-amount" placeholder="ยอดโอนจริง" class="w-full p-4 rounded-2xl text-sm font-bold">
                    </div>
                </div>
                <button id="btn-submit-topup" onclick="uploadSlip()" class="w-full mt-10 py-5 rounded-3xl bg-cyan-600 font-bold uppercase shadow-xl shadow-cyan-500/20">ส่งสลิปให้แอดมิน</button>
                <button onclick="showS('home')" class="mt-4 text-slate-500 text-[10px] block w-full underline italic">ยกเลิก</button>
            </div>
        </section>

        <section id="history-section" class="hidden py-4">
            <h2 class="text-2xl font-bold mb-8 text-cyan-400 uppercase italic tracking-tighter">History</h2>
            <div id="order-history-list" class="space-y-4"></div>
            <button onclick="showS('home')" class="mt-10 text-slate-500 text-[10px] block text-center w-full underline">กลับหน้าหลัก</button>
        </section>
    </main>

    <div id="admin-panel" class="hidden fixed inset-0 bg-[#020617] z-[100] overflow-y-auto p-4 md:p-12">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-12 border-b border-white/10 pb-8">
                <div>
                    <h1 class="text-3xl font-bold text-red-500 italic tracking-tighter uppercase">Admin Panel</h1>
                    <p class="text-[10px] text-slate-500 uppercase font-bold">Management System v4.0</p>
                </div>
                <button onclick="location.reload()" class="bg-slate-800 px-8 py-3 rounded-2xl text-xs font-bold border border-white/10 shadow-2xl">LOGOUT ADMIN</button>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <div class="glass p-8 rounded-[40px] border border-green-500/10 shadow-2xl">
                    <h3 class="text-green-500 font-bold mb-8 uppercase text-sm italic tracking-widest">Slip Requests</h3>
                    <div id="admin-topup-requests" class="space-y-6"></div>
                </div>

                <div class="glass p-8 rounded-[40px] border border-cyan-500/10 shadow-2xl">
                    <h3 class="text-cyan-500 font-bold mb-8 uppercase text-sm italic tracking-widest">Product Manager</h3>
                    <div class="bg-slate-900 p-6 rounded-3xl space-y-4 shadow-inner">
                        <p class="text-[10px] text-yellow-500 font-bold italic">* ถ้าใส่ชื่อสินค้าเดิม ระบบจะเอาไอดีไปเติมเพิ่มให้ทันที</p>
                        <input type="text" id="adm-p-name" placeholder="ชื่อสินค้า (ห้ามพิมพ์ผิด)" class="w-full p-4 rounded-2xl text-xs font-bold">
                        <input type="number" id="adm-p-price" placeholder="ราคาขาย (บาท)" class="w-full p-4 rounded-2xl text-xs font-bold">
                        <div class="p-4 bg-slate-800 rounded-2xl">
                            <label class="text-[10px] text-slate-500 mb-2 block uppercase font-bold tracking-widest">รูปภาพสินค้า:</label>
                            <input type="file" id="adm-p-file" accept="image/*" class="text-[10px]">
                        </div>
                        <textarea id="adm-p-stock" placeholder="ID:PASS (1 บรรทัด = 1 ไอดี)" class="w-full p-4 rounded-2xl h-40 text-xs font-bold font-mono"></textarea>
                        <button id="btn-admin-add" onclick="adminAdd()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 py-5 rounded-3xl font-bold text-sm uppercase shadow-xl">อัปโหลดสต็อก</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/98 flex items-center justify-center z-[200] p-4">
        <div class="glass p-10 rounded-[48px] w-full max-w-xs border-t-8 border-cyan-600 shadow-2xl">
            <h3 class="text-center font-bold mb-10 text-cyan-400 uppercase tracking-widest italic">Login</h3>
            <input type="text" id="l-user" placeholder="ชื่อผู้ใช้" class="w-full p-4 mb-4 rounded-2xl text-sm font-bold">
            <input type="password" id="l-pass" placeholder="รหัสผ่าน" class="w-full p-4 mb-10 rounded-2xl text-sm font-bold">
            <button onclick="login()" class="w-full bg-cyan-600 py-5 rounded-3xl font-bold shadow-xl uppercase tracking-widest">Sign In</button>
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="w-full mt-6 text-slate-500 text-[10px] uppercase underline italic">ปิดหน้าต่าง</button>
        </div>
    </div>

    <div id="reg-modal" class="hidden fixed inset-0 bg-black/98 flex items-center justify-center z-[200] p-4">
        <div class="glass p-10 rounded-[48px] w-full max-w-xs border-t-8 border-cyan-600 shadow-2xl">
            <h3 class="text-center font-bold mb-10 text-cyan-400 uppercase tracking-widest italic">Register</h3>
            <input type="text" id="r-user" placeholder="ชื่อผู้ใช้ที่ต้องการ" class="w-full p-4 mb-4 rounded-2xl text-sm font-bold">
            <input type="password" id="r-pass1" placeholder="รหัสผ่าน" class="w-full p-4 mb-4 rounded-2xl text-sm font-bold">
            <input type="password" id="r-pass2" placeholder="ยืนยันรหัสผ่าน" class="w-full p-4 mb-10 rounded-2xl text-sm font-bold">
            <button onclick="register()" class="w-full bg-cyan-600 py-5 rounded-3xl font-bold shadow-xl uppercase tracking-widest">Create Account</button>
            <button onclick="document.getElementById('reg-modal').classList.add('hidden')" class="w-full mt-6 text-slate-500 text-[10px] uppercase underline italic">ปิดหน้าต่าง</button>
        </div>
    </div>

    <div id="success-modal" class="hidden fixed inset-0 bg-black/98 flex items-center justify-center z-[400] p-4">
        <div class="glass p-12 rounded-[56px] w-full max-w-sm text-center border-t-8 border-green-500 shadow-2xl">
            <h3 class="font-bold mb-4 text-green-400 text-2xl italic uppercase tracking-tighter">Purchase Done ✅</h3>
            <p class="text-[10px] text-slate-500 mb-6 uppercase">คัดลอกรหัสผ่านด้านล่างนี้ไปใช้ได้เลย</p>
            <input type="text" id="acc-out" readonly class="w-full bg-slate-900 p-6 rounded-3xl text-cyan-400 font-bold text-center mb-10 border border-white/10 shadow-inner select-all text-lg">
            <button onclick="copyAcc()" class="w-full bg-cyan-600 py-5 rounded-3xl font-bold shadow-xl uppercase tracking-widest">Copy Account</button>
        </div>
    </div>

    <script>
        // --- Firebase Config (อย่าลืมใส่ตัวจริง!) ---
        var firebaseConfig = {
          apiKey: "AIzaSyD9c6XQkaxfimS6z3iIg5dh2filSsZ9fR8",
          authDomain: "apishop-c68d5.firebaseapp.com",
          projectId: "apishop-c68d5",
          storageBucket: "apishop-c68d5.firebasestorage.app",
          messagingSenderId: "1036199268260",
          appId: "1:1036199268260:web:ca385d7ccc7e321296fb31",
          databaseURL: "https://apishop-c68d5-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();
        var IMGBB_API_KEY = "37a72c1c69996d98d40787e997a02c81"; 

        var currentUser = null;

        // --- Auth System (Fix 100%) ---
        window.login = function() {
            var u = document.getElementById('l-user').value.trim();
            var p = document.getElementById('l-pass').value;
            if(!u || !p) return alert('กรอกข้อมูลให้ครบ!');

            if(u === 'Apishop' && p === 'Apishop100955') {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('login-modal').classList.add('hidden');
                return;
            }

            db.ref('users/' + u).once('value').then(snap => {
                var d = snap.val();
                if(d && d.password === p) {
                    currentUser = { ...d, username: u };
                    updateUI();
                    document.getElementById('login-modal').classList.add('hidden');
                } else alert('Username หรือ Password ไม่ถูกต้อง');
            });
        };

        window.register = function() {
            var u = document.getElementById('r-user').value.trim();
            var p1 = document.getElementById('r-pass1').value;
            var p2 = document.getElementById('r-pass2').value;
            if(!u || p1 !== p2) return alert('ข้อมูลไม่ถูกต้องหรือรหัสไม่ตรงกัน');
            db.ref('users/' + u).once('value', s => {
                if(s.exists()) return alert('ชื่อนี้ถูกใช้งานแล้ว');
                db.ref('users/' + u).set({ password: p1, balance: 0 }).then(() => {
                    alert('สมัครสมาชิกสำเร็จ!');
                    document.getElementById('reg-modal').classList.add('hidden');
                });
            });
        };

        function updateUI() {
            if(!currentUser) return;
            db.ref('users/' + currentUser.username).on('value', snap => {
                var d = snap.val();
                if(!d) return;
                document.getElementById('balance-card').classList.remove('hidden');
                document.getElementById('user-money').innerText = d.balance || 0;
                document.getElementById('user-display-name').innerText = currentUser.username;
                document.getElementById('auth-zone').innerHTML = '<span class="text-cyan-400 font-bold text-[10px] uppercase">' + currentUser.username + '</span><button onclick="location.reload()" class="ml-3 text-red-500 font-bold text-[10px]">LOGOUT</button>';
            });
        }

        window.showS = function(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
            if(id === 'history') renderHistory();
        };

        async function uploadFile(file) {
            var formData = new FormData();
            formData.append('image', file);
            var res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData });
            var d = await res.json();
            return d.success ? d.data.url : null;
        }

        // --- แจ้งโอน (Fix สลิปหาย) ---
        window.uploadSlip = async function() {
            var f = document.getElementById('slip-file').files[0];
            var a = document.getElementById('topup-amount').value;
            if(!f || !a || !currentUser) return alert('ใส่สลิปและจำนวนเงินให้ครบ');
            
            document.getElementById('btn-submit-topup').innerText = "กำลังอัปโหลดสลิป...";
            var url = await uploadFile(f);
            if(url) {
                db.ref('topup_requests').push({
                    username: currentUser.username,
                    amount: parseInt(a),
                    slip: url,
                    date: new Date().toLocaleString()
                }).then(() => {
                    alert('ส่งข้อมูลให้แอดมินเรียบร้อย รอการตรวจสอบ');
                    showS('home');
                });
            } else alert('อัปโหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง');
            document.getElementById('btn-submit-topup').innerText = "ส่งสลิปให้แอดมิน";
        };

        // --- แอดมิน: ระบบเติมสต็อก (Merge Stock Fix) ---
        window.adminAdd = async function() {
            var name = document.getElementById('adm-p-name').value.trim();
            var price = parseInt(document.getElementById('adm-p-price').value);
            var file = document.getElementById('adm-p-file').files[0];
            var newStock = document.getElementById('adm-p-stock').value.split('\n').filter(l => l.trim() !== "");

            if(!name || isNaN(price) || newStock.length === 0) return alert('ใส่ข้อมูลให้ครบ!');
            
            var btn = document.getElementById('btn-admin-add');
            btn.innerText = "กำลังอัปเดตระบบ..."; btn.disabled = true;

            db.ref('products').once('value', async snap => {
                var products = snap.val() || {};
                var foundId = null;
                var oldStock = [];
                var oldImg = null;

                Object.keys(products).forEach(k => {
                    if(products[k].name === name) {
                        foundId = k;
                        oldStock = products[k].stock || [];
                        oldImg = products[k].image;
                    }
                });

                var finalImg = oldImg;
                if(file) finalImg = await uploadFile(file);

                if(!finalImg) {
                    alert('ต้องแนบรูปสินค้าสำหรับการลงใหม่!');
                    btn.disabled = false; return;
                }

                var finalId = foundId || Date.now();
                var combinedStock = [...oldStock, ...newStock];

                db.ref('products/' + finalId).set({
                    name: name,
                    price: price,
                    image: finalImg,
                    stock: combinedStock
                }).then(() => {
                    alert('บันทึกสต็อกสินค้าแล้ว!');
                    document.getElementById('adm-p-stock').value = "";
                    btn.disabled = false; btn.innerText = "อัปโหลดสต็อก";
                });
            });
        };

        // --- แสดงสินค้า ---
        db.ref('products').on('value', snap => {
            var val = snap.val();
            var products = val ? Object.keys(val).map(k => ({ ...val[k], id: k })) : [];
            document.getElementById('product-list').innerHTML = products.map(p => {
                var count = p.stock ? p.stock.length : 0;
                return '<div class="glass overflow-hidden rounded-[40px] border border-white/5 flex flex-col shadow-2xl transition hover:border-cyan-500/50">' +
                    '<img src="' + p.image + '" class="w-full h-52 object-cover">' +
                    '<div class="p-6 flex flex-col flex-grow">' +
                        '<h3 class="text-white font-bold text-sm mb-1 uppercase">' + p.name + '</h3>' +
                        '<p class="text-[10px] text-slate-500 mb-6 font-mono tracking-widest">STOCK: ' + count + ' ชิ้น</p>' +
                        '<div class="flex justify-between items-center mt-auto">' +
                            '<span class="text-2xl font-bold text-white tracking-tighter">' + p.price + ' <span class="text-[10px] text-cyan-400 font-normal">฿</span></span>' +
                            '<button onclick="buyProduct(\'' + p.id + '\')" class="bg-cyan-600 px-6 py-3 rounded-2xl text-[10px] font-bold shadow-lg shadow-cyan-500/20 uppercase">สั่งซื้อ</button>' +
                    '</div></div></div>';
            }).join('');
        });

        window.buyProduct = function(id) {
            if(!currentUser) return alert('กรุณาล็อกอินก่อนซื้อ');
            db.ref('products/' + id).once('value', psnap => {
                var p = psnap.val();
                if(!p || !p.stock || p.stock.length === 0) return alert('สินค้าหมดชั่วคราว');
                db.ref('users/' + currentUser.username).once('value', usnap => {
                    var u = usnap.val();
                    if(u.balance < p.price) return alert('ยอดเงินของคุณไม่เพียงพอ');
                    
                    var item = p.stock.shift();
                    var orders = u.orders || [];
                    orders.unshift({ name: p.name, account: item, date: new Date().toLocaleString() });

                    db.ref('products/' + id + '/stock').set(p.stock);
                    db.ref('users/' + currentUser.username).update({ balance: u.balance - p.price, orders: orders }).then(() => {
                        document.g
