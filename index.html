<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apishop - Final Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { font-family: 'Kanit', sans-serif; box-sizing: border-box; }
        body { background-color: #020617; color: #e2e8f0; margin: 0; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <nav class="p-4 glass sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
            <div class="p-2 bg-cyan-500 rounded-lg text-white font-bold">AS</div>
            <h1 class="text-xl font-bold uppercase">Apishop</h1>
        </div>
        <div id="auth-zone" class="flex gap-2">
            <button onclick="openM('login-modal')" class="text-white px-3 text-sm">เข้าสู่ระบบ</button>
            <button onclick="openM('reg-modal')" class="bg-cyan-600 px-5 py-1.5 rounded-full text-sm font-bold shadow-lg">สมัครสมาชิก</button>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <div id="balance-card" class="hidden mb-6 p-6 glass rounded-3xl flex justify-between items-center border-l-4 border-cyan-500">
            <div>
                <p class="text-slate-400 text-xs uppercase">ผู้ใช้งาน: <span id="user-display-name" class="text-cyan-400"></span></p>
                <h2 class="text-3xl font-bold text-white"><span id="user-money">0</span> <span class="text-cyan-500 text-sm">฿</span></h2>
            </div>
            <div class="flex gap-2">
                <button onclick="showS('history')" class="bg-slate-800 px-4 py-2 rounded-xl text-xs">📜 ประวัติ</button>
                <button onclick="showS('topup')" class="bg-cyan-600 px-4 py-2 rounded-xl text-xs font-bold">➕ เติมเงิน</button>
            </div>
        </div>

        <section id="home-section">
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </section>

        <section id="topup-section" class="hidden max-w-md mx-auto py-6">
            <div class="glass p-6 rounded-3xl text-center border border-cyan-500/20">
                <h2 class="text-xl font-bold mb-4 uppercase">แจ้งโอนเงิน</h2>
                <div class="bg-slate-900 p-4 rounded-2xl mb-6">
                    <p class="text-slate-500 text-[10px] mb-1">โอนเข้าวอลเล็ต</p>
                    <p class="text-xl font-bold text-cyan-400">096-998-0396</p>
                </div>
                <div class="text-left space-y-4">
                    <input type="file" id="slip-file" accept="image/*" class="w-full text-xs text-slate-400">
                    <input type="number" id="topup-amount" placeholder="ระบุยอดเงิน" class="w-full p-3 rounded-xl bg-slate-800 border-none text-white">
                </div>
                <button id="btn-submit-topup" onclick="uploadSlip()" class="w-full mt-6 py-3 rounded-xl bg-cyan-600 font-bold">ส่งสลิป</button>
                <button onclick="showS('home')" class="mt-4 text-slate-500 text-xs block w-full underline">ยกเลิก</button>
            </div>
        </section>

        <section id="history-section" class="hidden max-w-xl mx-auto py-6">
            <div id="order-history-list" class="space-y-2"></div>
            <button onclick="showS('home')" class="mt-6 text-cyan-400 text-xs block text-center w-full">← กลับหน้าหลัก</button>
        </section>
    </main>

    <div id="admin-panel" class="hidden fixed inset-0 bg-[#020617] z-[100] overflow-y-auto p-4">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold text-red-500">ADMIN</h1>
                <button onclick="closeM('admin-panel')" class="bg-slate-800 px-4 py-2 rounded-xl text-xs">ปิด</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass p-4 rounded-xl">
                    <h3 class="text-green-400 font-bold mb-4">รายการสลิป</h3>
                    <div id="admin-topup-requests" class="space-y-3"></div>
                </div>
                <div class="glass p-4 rounded-xl">
                    <h3 class="text-cyan-400 font-bold mb-4">ลงสินค้า/จัดการเงิน</h3>
                    <div id="admin-user-list" class="mb-6 space-y-2"></div>
                    <input type="text" id="adm-p-name" placeholder="ชื่อสินค้า" class="w-full p-2 mb-2 rounded bg-slate-900 text-xs">
                    <input type="number" id="adm-p-price" placeholder="ราคา" class="w-full p-2 mb-2 rounded bg-slate-900 text-xs">
                    <textarea id="adm-p-stock" placeholder="ไอดี:รหัส" class="w-full p-2 mb-2 rounded bg-slate-900 h-20 text-xs"></textarea>
                    <button onclick="adminAdd()" class="w-full bg-cyan-600 py-2 rounded font-bold text-xs">ลงขาย</button>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[200]">
        <div class="glass p-8 rounded-3xl w-80 border-t-4 border-cyan-500">
            <input type="text" id="l-user" placeholder="Username" class="w-full p-3 mb-2 rounded-xl bg-slate-900 text-white">
            <input type="password" id="l-pass" placeholder="Password" class="w-full p-3 mb-4 rounded-xl bg-slate-900 text-white">
            <button onclick="login()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold">LOGIN</button>
            <button onclick="closeM('login-modal')" class="w-full mt-2 text-slate-500 text-xs">CLOSE</button>
        </div>
    </div>

    <div id="reg-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[200]">
        <div class="glass p-8 rounded-3xl w-80 border-t-4 border-cyan-500">
            <input type="text" id="r-user" placeholder="Username" class="w-full p-3 mb-2 rounded-xl bg-slate-900 text-white">
            <input type="password" id="r-pass1" placeholder="Password" class="w-full p-3 mb-2 rounded-xl bg-slate-900 text-white">
            <input type="password" id="r-pass2" placeholder="Confirm" class="w-full p-3 mb-4 rounded-xl bg-slate-900 text-white">
            <button onclick="register()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold">REGISTER</button>
            <button onclick="closeM('reg-modal')" class="w-full mt-2 text-slate-500 text-xs">CLOSE</button>
        </div>
    </div>

    <div id="success-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[400]">
        <div class="glass p-6 rounded-3xl w-72 text-center">
            <h3 class="font-bold mb-4">SUCCESS! ✅</h3>
            <input type="text" id="acc-out" readonly class="w-full bg-slate-900 p-3 rounded mb-4 text-cyan-400 text-center">
            <button onclick="copyAcc()" class="w-full bg-cyan-600 py-2 rounded font-bold">COPY</button>
            <button onclick="closeM('success-modal')" class="mt-2 text-slate-500 text-xs">CLOSE</button>
        </div>
    </div>

    <script>
        // Config
        const firebaseConfig = {
          apiKey: "AIzaSyD9c6XQkaxfimS6z3iIg5dh2filSsZ9fR8",
          authDomain: "apishop-c68d5.firebaseapp.com",
          projectId: "apishop-c68d5",
          storageBucket: "apishop-c68d5.firebasestorage.app",
          messagingSenderId: "1036199268260",
          appId: "1:1036199268260:web:ca385d7ccc7e321296fb31",
          databaseURL: "https://apishop-c68d5-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const IMGBB_API_KEY = "37a72c1c69996d98d40787e997a02c81"; 

        let users = [];
        let products = [];
        let currentUser = null;

        // Listeners
        db.ref('users').on('value', s => { 
            const val = s.val();
            users = val ? Object.keys(val).map(k => ({...val[k], username: k})) : []; 
            if(currentUser) {
                const updated = users.find(u => u.username === currentUser.username);
                if(updated) { currentUser = updated; updateUI(); }
            }
            renderAdmin();
        });

        db.ref('products').on('value', s => { 
            const val = s.val();
            products = val ? Object.keys(val).map(k => ({...val[k], id: k})) : []; 
            renderP();
            renderAdmin();
        });

        // UI Core
        function openM(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeM(id) { document.getElementById(id).classList.add('hidden'); }
        function showS(id) {
            ['home', 'topup', 'history'].forEach(s => document.getElementById(s + '-section').classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
            if(id === 'history') renderHistory();
        }

        async function uploadSlip() {
            if(!currentUser) return alert('กรุณาล็อกอิน');
            const fileInput = document.getElementById('slip-file');
            const amountInput = document.getElementById('topup-amount');
            if(!fileInput.files[0] || !amountInput.value) return alert('ใส่ข้อมูลให้ครบ');

            const btn = document.getElementById('btn-submit-topup');
            btn.innerText = "...รออัปโหลด...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
                const data = await res.json();
                if(data.success) {
                    await db.ref('topup_requests/' + Date.now()).set({
                        username: currentUser.username,
                        amount: parseInt(amountInput.value),
                        slip: data.data.url,
                        date: new Date().toLocaleString()
                    });
                    alert('ส่งสลิปแล้ว รอแอดมินอนุมัติ');
                    showS('home');
                } else alert('อัปโหลดล้มเหลว');
            } catch (e) { alert('Error: ' + e.message); }
            btn.innerText = "ส่งสลิป";
            btn.disabled = false;
        }

        function login() {
            const u = document.getElementById('l-user').value.trim();
            const p = document.getElementById('l-pass').value;
            if(u === 'Apishop' && p === 'Apishop100955') {
                const k = prompt("Master Key:");
                if(k === "100955") { openM('admin-panel'); closeM('login-modal'); return; }
            }
            const user = users.find(x => x.username === u && x.password === p);
            if(user) { currentUser = user; updateUI(); closeM('login-modal'); }
            else alert('ชื่อหรือรหัสผ่านผิด');
        }

        function register() {
            const u = document.getElementById('r-user').value.trim();
            const p1 = document.getElementById('r-pass1').value;
            const p2 = document.getElementById('r-pass2').value;
            if(!u || !p1 || p1 !== p2) return alert('ข้อมูลไม่ถูกต้อง');
            db.ref('users/' + u).set({ username: u, password: p1, balance: 0, orders: [] }).then(() => { alert('สมัครสำเร็จ'); closeM('reg-modal'); });
        }

        function updateUI() {
            if(!currentUser) return;
            document.getElementById('balance-card').classList.remove('hidden');
            document.getElementById('user-money').innerText = currentUser.balance;
            document.getElementById('user-display-name').innerText = currentUser.username;
            document.getElementById('auth-zone').innerHTML = `<span class="text-cyan-400 font-bold text-sm uppercase">${currentUser.username}</span><button onclick="location.reload()" class="ml-2 text-red-500 text-[10px]">ออก</button>`;
        }

        function renderAdmin() {
            db.ref('topup_requests').on('value', s => {
                const reqs = s.val();
                let h = '';
                if(reqs) {
                    Object.keys(reqs).forEach(id => {
                        const r = reqs[id];
                        h += `<div class="p-3 bg-slate-900 rounded-xl border border-white/5 text-xs">
                            <p>${r.username} | ${r.amount} ฿</p>
                            <a href="${r.slip}" target="_blank"><img src="${r.slip}" class="w-full h-20 object-cover my-2 rounded"></a>
                            <button onclick="approveMoney('${id}', '${r.username}', ${r.amount})" class="w-full bg-green-600 py-1 rounded">อนุมัติ</button>
                        </div>`;
                    });
                }
                document.getElementById('admin-topup-requests').innerHTML = h || 'ไม่มีคำขอ';
            });
            document.getElementById('admin-user-list').innerHTML = users.map(u => `<div class="p-2 bg-slate-900 rounded flex justify-between text-[10px]"><span>${u.username}</span><button onclick="editMoney('${u.username}')" class="text-yellow-500">${u.balance}฿</button></div>`).join('');
        }

        function approveMoney(reqId, uName, amt) {
            const user = users.find(x => x.username === uName);
            if(user) {
                db.ref('users/' + uName + '/balance').set((user.balance || 0) + amt);
                db.ref('topup_requests/' + reqId).remove();
            }
        }

        function editMoney(uName) {
            const m = prompt(`แก้เงิน ${uName}:`);
            if (m !== null) db.ref('users/' + uName + '/balance').set(parseInt(m));
        }

        function adminAdd() {
            const n = document.getElementById('adm-p-name').value;
            const p = parseInt(document.getElementById('adm-p-price').value);
            const s = document.getElementById('adm-p-stock').value.split('\n').filter(l => l.trim() !== "");
            if(n && p) db.ref('products/' + Date.now()).set({ name: n, price: p, stock: s }).then(() => alert('ลงแล้ว'));
        }

        function buyProduct(pId) {
            if(!currentUser) return alert('ล็อกอินก่อนครับ');
            const p = products.find(x => x.id == pId);
            if(!p || !p.stock || p.stock.length === 0) return alert('หมด');
            if(currentUser.balance < p.price) return alert('เงินไม่พอ');
            const acc = p.stock.shift();
            if(!currentUser.orders) currentUser.orders = [];
            currentUser.orders.unshift({ name: p.name, account: acc, date: new Date().toLocaleString() });
            db.ref('products/' + pId + '/stock').set(p.stock);
            db.ref('users/' + currentUser.username + '/balance').set(currentUser.balance - p.price);
            db.ref('users/' + currentUser.username + '/orders').set(currentUser.orders);
            document.getElementById('acc-out').value = acc;
            openM('success-modal');
        }

        function renderP() {
            document.getElementById('product-list').innerHTML = products.map(p => `
                <div class="glass p-4 rounded-3xl border border-white/5 flex flex-col justify-between">
                    <h3 class="text-white font-bold text-sm">${p.name}</h3>
                    <p class="text-[10px] text-slate-500 mb-4 uppercase italic">Stock: ${p.stock ? p.stock.length : 0}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-bold">${p.price} ฿</span>
                        <button onclick="buyProduct('${p.id}')" class="bg-cyan-600 px-4 py-1.5 rounded-xl text-xs font-bold uppercase">Buy</button>
                    </div>
                </div>`).join('');
        }

        function renderHistory() {
            const l = document.getElementById('order-history-list');
            if(!currentUser.orders) return l.innerHTML = 'ไม่มีประวัติ';
            l.innerHTML = currentUser.orders.map(o => `<div class="glass p-4 rounded-xl mb-2 text-xs font-mono"><p class="text-slate-500">${o.date}</p><p class="text-white font-bold">${o.name}</p><p class="text-cyan-400 mt-1">${o.account}</p></div>`).join('');
        }

        function copyAcc() { const o = document.getElementById('acc-out'); o.select(); document.execCommand('copy'); alert('Copy OK!'); }
    </script>
</body>
  </html>
