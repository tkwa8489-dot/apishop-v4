<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apishop - Slip Confirm Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { font-family: 'Kanit', sans-serif; box-sizing: border-box; }
        body { background-color: #020617; color: #e2e8f0; margin: 0; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-cyan { background: linear-gradient(45deg, #0891b2, #06b6d4); color: white; transition: 0.3s; cursor: pointer; }
        .btn-cyan:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav class="p-4 glass sticky top-0 z-50 flex justify-between items-center border-b border-cyan-900/30">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="p-2 bg-cyan-500 rounded-lg text-white font-bold shadow-lg">AS</div>
            <h1 class="text-xl font-bold text-white tracking-tighter uppercase">Apishop</h1>
        </div>
        <div id="auth-zone" class="flex gap-2 text-sm">
            <button onclick="openM('login-modal')" class="text-white px-2">เข้าสู่ระบบ</button>
            <button onclick="openM('reg-modal')" class="btn-cyan px-5 py-1.5 rounded-full font-semibold">สมัครสมาชิก</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-6">
        <div id="balance-card" class="hidden mb-8 p-6 glass rounded-3xl flex justify-between items-center border-l-8 border-cyan-500">
            <div>
                <p class="text-slate-400 text-xs uppercase">ยอดเงินคงเหลือ</p>
                <h2 class="text-3xl font-bold text-white"><span id="user-money">0</span> <span class="text-cyan-500 text-sm">฿</span></h2>
            </div>
            <div class="flex gap-2">
                <button onclick="showS('history')" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-[10px]">📜 ประวัติ</button>
                <button onclick="showS('topup')" class="bg-cyan-600 text-white px-6 py-2 rounded-xl text-[10px] font-bold shadow-lg">➕ เติมเงิน</button>
            </div>
        </div>

        <section id="home-section">
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </section>

        <section id="topup-section" class="hidden max-w-xl mx-auto py-6">
            <div class="glass p-8 rounded-3xl text-center border border-cyan-500/30">
                <h2 class="text-2xl font-bold mb-2 text-white italic uppercase">แจ้งโอนเงิน</h2>
                <div class="bg-slate-900 p-4 rounded-2xl mb-6 border border-white/5">
                    <p class="text-slate-400 text-xs mb-1">เบอร์วอลเล็ตแอดมิน</p>
                    <p class="text-2xl font-bold text-cyan-400 tracking-widest">096-998-0396</p>
                </div>
                
                <div class="text-left space-y-4">
                    <div>
                        <label class="text-xs text-slate-400 block mb-2">1. แนบรูปสลิปการโอน</label>
                        <input type="file" id="slip-file" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-2">2. ระบุจำนวนเงินที่โอน</label>
                        <input type="number" id="topup-amount" placeholder="ระบุจำนวนเงิน (เช่น 50)" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 text-white outline-none focus:border-cyan-500">
                    </div>
                </div>

                <button id="btn-submit-topup" onclick="uploadSlip()" class="w-full mt-8 py-4 rounded-2xl bg-cyan-600 font-bold text-white shadow-lg shadow-cyan-500/20">ส่งสลิปให้แอดมินเช็ค</button>
                <button onclick="showS('home')" class="mt-4 text-slate-500 text-sm block w-full">ยกเลิก</button>
            </div>
        </section>

        <section id="history-section" class="hidden max-w-2xl mx-auto py-6">
            <div id="order-history-list" class="space-y-3"></div>
            <button onclick="showS('home')" class="mt-6 text-cyan-400 text-sm block text-center w-full">← กลับหน้าหลัก</button>
        </section>
    </main>

    <div id="admin-panel" class="hidden fixed inset-0 bg-[#020617] z-[100] overflow-y-auto p-4 md:p-8">
        <div class="max-w-7xl mx-auto text-white">
            <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-6">
                <h1 class="text-2xl font-bold text-red-500 italic">ADMIN CONTROL</h1>
                <button onclick="closeM('admin-panel')" class="bg-slate-800 px-6 py-2 rounded-xl text-white">ปิด</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-green-400 font-bold mb-4">📥 รายการสลิปที่รอเช็ค</h3>
                    <div id="admin-topup-requests" class="space-y-4"></div>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-cyan-400 font-bold mb-4">📦 จัดการสมาชิก & สินค้า</h3>
                    <div id="admin-user-list" class="space-y-2 mb-6"></div>
                    <hr class="opacity-10 mb-6">
                    <input type="text" id="adm-p-name" placeholder="ชื่อสินค้า" class="w-full p-3 mb-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs">
                    <input type="number" id="adm-p-price" placeholder="ราคา" class="w-full p-3 mb-2 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs">
                    <textarea id="adm-p-stock" placeholder="ไอดี:รหัส (1 บรรทัด ต่อ 1 อัน)" class="w-full p-3 mb-2 rounded-xl bg-slate-900 border border-slate-700 h-24 text-white text-xs"></textarea>
                    <button onclick="adminAdd()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold text-xs">ลงขายสินค้า</button>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border-t-4 border-cyan-500">
            <h3 class="text-xl font-bold mb-6 text-center text-white uppercase italic">Login</h3>
            <input type="text" id="l-user" placeholder="Username" class="w-full p-3 mb-3 rounded-xl bg-slate-900 border border-slate-700 text-white">
            <input type="password" id="l-pass" placeholder="Password" class="w-full p-3 mb-6 rounded-xl bg-slate-900 border border-slate-700 text-white">
            <button onclick="login()" class="w-full btn-cyan py-3 rounded-xl font-bold">เข้าสู่ระบบ</button>
            <button onclick="closeM('login-modal')" class="w-full mt-4 text-slate-500 text-xs text-center">ปิด</button>
        </div>
    </div>

    <div id="reg-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-sm border-t-4 border-cyan-500">
            <h3 class="text-xl font-bold mb-6 text-center text-white uppercase italic">Register</h3>
            <input type="text" id="r-user" placeholder="Username" class="w-full p-3 mb-3 rounded-xl bg-slate-900 border border-slate-700 text-white">
            <input type="password" id="r-pass1" placeholder="Password" class="w-full p-3 mb-3 rounded-xl bg-slate-900 border border-slate-700 text-white">
            <input type="password" id="r-pass2" placeholder="Confirm Password" class="w-full p-3 mb-6 rounded-xl bg-slate-900 border border-slate-700 text-white">
            <button onclick="register()" class="w-full btn-cyan py-3 rounded-xl font-bold">สมัครสมาชิก</button>
            <button onclick="closeM('reg-modal')" class="w-full mt-4 text-slate-500 text-xs text-center">ปิด</button>
        </div>
    </div>

    <div id="success-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[400] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-sm text-center border-t-4 border-green-500">
            <h3 class="text-xl font-bold mb-2 text-white italic">SUCCESS! ✅</h3>
            <input type="text" id="acc-out" readonly class="w-full bg-slate-900 p-4 rounded-xl text-cyan-400 font-bold text-center my-4 font-mono">
            <button onclick="copyAcc()" class="w-full bg-cyan-600 py-3 rounded-xl text-white font-bold mb-4 uppercase">Copy ID</button>
            <button onclick="closeM('success-modal')" class="text-slate-500 text-xs">ปิดหน้าต่าง</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyD9c6XQkaxfimS6z3iIg5dh2filSsZ9fR8",
          authDomain: "apishop-c68d5.firebaseapp.com",
          projectId: "apishop-c68d5",
          storageBucket: "apishop-c68d5.firebasestorage.app",
          messagingSenderId: "1036199268260",
          appId: "1:1036199268260:web:ca385d7ccc7e321296fb31",
          databaseURL: "https://apishop-c68d5-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let users = [];
        let products = [];
        let currentUser = null;

        // --- ส่วนที่น้องต้องแก้: ใส่ API Key ของ ImgBB ที่นี่ (ถ้ายังไม่มีใช้ตัวนี้ไปก่อนได้) ---
        const IMGBB_API_KEY = "37a72c1c69996d98d40787e997a02c81"; 

        db.ref('users').on('value', (s) => { 
            const val = s.val();
            users = val ? Object.keys(val).map(key => ({...val[key], username: key})) : []; 
            if(currentUser) {
                const updated = users.find(u => u.username === currentUser.username);
                if(updated) { currentUser = updated; updateUI(); }
            }
            renderAdmin();
        });

        db.ref('products').on('value', (s) => { 
            const val = s.val();
            products = val ? Object.keys(val).map(key => ({...val[key], id: key})) : []; 
            renderP(); 
            renderAdmin();
        });

        function openM(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeM(id) { document.getElementById(id).classList.add('hidden'); }
        function showS(id) {
            ['home', 'topup', 'history'].forEach(s => document.getElementById(s + '-section').classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
            if(id === 'history') renderHistory();
        }

        // --- ระบบอัปโหลดสลิป ---
        async function uploadSlip() {
            if(!currentUser) return alert('กรุณาล็อกอินก่อน');
            const fileInput = document.getElementById('slip-file');
            const amountInput = document.getElementById('topup-amount');
            
            if(!fileInput.files[0]) return alert('กรุณาเลือกรูปสลิป');
            if(!amountInput.value || amountInput.value <= 0) return alert('กรุณาระบุจำนวนเงิน');

            const btn = document.getElementById('btn-submit-topup');
            btn.innerText = "กำลังอัปโหลดรูป...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            try {
                // ส่งรูปไปที่ ImgBB
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if(result.success) {
                    const slipUrl = result.data.url;
                    const reqId = Date.now();
                    
                    // ส่งลิงก์รูปไปที่ Firebase
                    await db.ref('topup_requests/' + reqId).set({
                        username: currentUser.username,
                        amount: parseInt(amountInput.value),
                        slip: slipUrl,
                        date: new Date().toLocaleString()
                    });

                    alert('✅ ส่งสลิปสำเร็จ! รอแอดมินเช็คยอดสักครู่');
                    fileInput.value = "";
                    amountInput.value = "";
                    showS('home');
                } else {
                    alert('อัปโหลดรูปไม่สำเร็จ');
                }
            } catch (e) {
                alert('เกิดข้อผิดพลาด: ' + e.message);
            } finally {
                btn.innerText = "ส่งสลิปให้แอดมินเช็ค";
                btn.disabled = false;
            }
        }

        function renderAdmin() {
            // โชว์รายการสลิปให้แอดมินเช็ค
            db.ref('topup_requests').on('value', (s) => {
                const reqs = s.val();
                let html = '';
                if(reqs) {
                    Object.keys(reqs).forEach(id => {
                        if(id === '0') return;
                        const r = reqs[id];
                        html += `<div class="p-4 bg-slate-900 rounded-2xl border border-white/5 space-y-3">
                            <div class="flex justify-between text-xs">
                                <span class="text-cyan-400 font-bold">👤 ${r.username}</span>
                                <span class="text-green-400 font-bold">${r.amount} ฿</span>
                            </div>
                            <a href="${r.slip}" target="_blank" class="block">
                                <img src="${r.slip}" class="w-full h-32 object-cover rounded-xl border border-white/10 hover:opacity-80">
                                <p class="text-[10px] text-center text-slate-500 mt-1">คลิกเพื่อดูรูปใหญ่</p>
                            </a>
                            <button onclick="approveMoney('${id}', '${r.username}', ${r.amount})" class="w-full bg-green-600 py-2 rounded-xl font-bold text-xs uppercase shadow-lg shadow-green-600/20">อนุมัติเงิน</button>
                        </div>`;
                    });
                }
                document.getElementById('admin-topup-requests').innerHTML = html || '<p class="text-center text-slate-500 py-10 text-xs">ไม่มีคำขอที่ค้างอยู่</p>';
            });

            // รายชื่อคน
            document.getElementById('admin-user-list').innerHTML = users.map(u => `
                <div class="p-2 bg-slate-900 rounded-xl flex justify-between items-center text-[10px]">
                    <span>${u.username}</span>
                    <button onclick="editMoney('${u.username}')" class="text-yellow-500 font-bold">${u.balance} ฿</button>
                </div>`).join('');
        }

        function approveMoney(reqId, uName, amt) {
            const user = users.find(x => x.username === uName);
            if(user) {
                db.ref('users/' + uName + '/balance').set((user.balance || 0) + amt);
                db.ref('topup_requests/' + reqId).remove();
                alert('อนุมัติเงินเรียบร้อย!');
            }
        }

        function editMoney(uName) {
            const m = prompt(`แก้เงินให้ ${uName}:`);
            if (m === null || isNaN(m)) return;
            db.ref('users/' + uName + '/balance').set(parseInt(m));
        }

        function login() {
            const u = document.getElementById('l-user').value.trim();
            const p = document.getElementById('l-pass').value;
            if(u === 'Apishop' && p === 'Apishop100955') {
                const k = prompt("Master Key:");
                if(k === "100955") { openM('admin-panel'); closeM('login-modal'); return; }
            }
            const user = users.find(x => x.username === u && x.password === p);
            if(user) { currentUser = user; updateUI(); closeM('login-modal'); }
            else alert('รหัสผิด!');
        }

        function register() {
            const u = document.getElementById('r-user').value.trim();
            const p1 = document.getElementById('r-pass1').value;
            const p2 = document.getElementById('r-pass2').value;
            if(!u || !p1 || p1 !== p2) return alert('ข้อมูลไม่ถูกต้อง');
            db.ref('users/' + u).set({ username: u, password: p1, balance: 0, orders: [] }).then(() => { alert('สมัครสำเร็จ!'); closeM('reg-modal'); });
        }

        function updateUI() {
            if(!currentUser) return;
            document.getElementById('balance-card').classList.remove('hidden');
            document.getElementById('user-money').innerText = currentUser.balance;
            document.getElementById('auth-zone').innerHTML = `<span class="text-cyan-400 font-bold uppercase">${currentUser.username}</span><button onclick="location.reload()" class="ml-2 text-red-500 text-[10px]">OUT</button>`;
        }

        function adminAdd() {
            const n = document.getElementById('adm-p-name').value;
            const p = parseInt(document.getElementById('adm-p-price').value);
            const s = document.getElementById('adm-p-stock').value.split('\n').filter(l => l.trim() !== "");
            if(!n || !p) return alert('กรอกไม่ครบ!');
            db.ref('products/' + Date.now()).set({ name: n, price: p, stock: s }).then(() => alert('ลงแล้ว!'));
        }

        function buyProduct(pId) {
            if(!currentUser) return alert('ล็อกอินก่อน!');
            const p = products.find(x => x.id == pId);
            if(!p || !p.stock || p.stock.length === 0) return alert('หมด!');
            if(currentUser.balance < p.price) return alert('เงินไม่พอ!');
            const acc = p.stock.shift();
            if(!currentUser.orders) currentUser.orders = [];
            currentUser.orders.unshift({ name: p.name, account: acc, date: new Date().toLocaleString() });
            db.ref('products/' + pId + '/stock').set(p.stock);
            db.ref('users/' + currentUser.username + '/balance').set(currentUser.balance - p.price);
            db.ref('users/' + currentUser.username + '/orders').set(currentUser.orders);
            document.getElementById('acc-out').value = acc;
            openM('success-modal');
        }

        function renderP() {
            document.getElementById('product-list').innerHTML = products.map(p => `
                <div class="glass p-5 rounded-3xl border border-slate-800 flex flex-col justify-between">
                    <div class="h-24 bg-slate-900 rounded-2xl mb-4 flex items-center justify-center text-slate-700 font-bold uppercase text-[10px]">Apishop Item</div>
                    <h3 class="text-white font-bold text-sm">${p.name}</h3>
                    <p class="text-[10px] text-slate-500 mb-4 font-mono">STOCK: ${p.stock ? p.stock.length : 0}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-bold text-white">${p.price} ฿</span>
                        <button onclick="buyProduct('${p.id}')" class="bg-cyan-600 px-4 py-1.5 rounded-xl text-[10px] font-bold text-white uppercase">Buy</button>
                    </div>
                </div>`).join('');
        }

        function renderHistory() {
            const list = document.getElementById('order-history-list');
            if(!currentUser.orders) return list.innerHTML = '<p class="text-center text-slate-500 py-10 text-xs">ไม่มีประวัติการซื้อ</p>';
            list.innerHTML = currentUser.orders.map(o => `<div class="glass p-4 rounded-2xl borde
