<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apishop-v4 | Market Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { font-family: 'Kanit', sans-serif; box-sizing: border-box; }
        body { background-color: #020617; color: #e2e8f0; margin: 0; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <nav class="p-4 glass sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-2" onclick="location.reload()" style="cursor:pointer">
            <div class="p-2 bg-cyan-500 rounded-lg text-white font-bold text-xs">AS</div>
            <h1 class="text-lg font-bold uppercase tracking-tight">Apishop</h1>
        </div>
        <div id="auth-zone" class="flex gap-2">
            <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="text-white px-3 text-[10px] font-bold uppercase">Login</button>
            <button onclick="document.getElementById('reg-modal').classList.remove('hidden')" class="bg-cyan-600 px-4 py-1.5 rounded-full text-[10px] font-bold shadow-lg">Register</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 max-w-6xl">
        <div id="balance-card" class="hidden mb-6 p-5 glass rounded-3xl flex justify-between items-center border-l-4 border-cyan-500">
            <div>
                <p class="text-slate-400 text-[10px] uppercase">ยินดีต้อนรับ: <span id="user-display-name" class="text-cyan-400"></span></p>
                <h2 class="text-2xl font-bold text-white"><span id="user-money">0</span> <span class="text-cyan-500 text-xs">฿</span></h2>
            </div>
            <div class="flex gap-2">
                <button onclick="showS('history')" class="bg-slate-800 p-2.5 rounded-xl text-[10px]">📜 ประวัติ</button>
                <button onclick="showS('topup')" class="bg-cyan-600 px-4 py-2 rounded-xl text-[10px] font-bold">➕ เติมเงิน</button>
            </div>
        </div>

        <section id="home-section">
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="topup-section" class="hidden max-w-md mx-auto py-4">
            <div class="glass p-8 rounded-3xl text-center border border-cyan-500/20 shadow-2xl">
                <h2 class="text-xl font-bold mb-6 text-cyan-400">เติมเงิน</h2>
                <div class="bg-slate-900 p-4 rounded-2xl mb-6">
                    <p class="text-xl font-bold text-white">096-998-0396</p>
                </div>
                <div class="text-left space-y-4">
                    <input type="file" id="slip-file" accept="image/*" class="text-xs text-slate-500">
                    <input type="number" id="topup-amount" placeholder="ยอดเงิน" class="w-full p-4 rounded-xl bg-slate-800 text-white outline-none">
                </div>
                <button id="btn-submit-topup" onclick="uploadSlip()" class="w-full mt-8 py-4 rounded-2xl bg-cyan-600 font-bold">แจ้งโอน</button>
                <button onclick="showS('home')" class="mt-4 text-slate-500 text-xs block w-full underline">ยกเลิก</button>
            </div>
        </section>

        <section id="history-section" class="hidden py-4">
            <h2 class="text-xl font-bold mb-6 text-cyan-400 italic italic">History</h2>
            <div id="order-history-list" class="space-y-4"></div>
            <button onclick="showS('home')" class="mt-8 text-slate-500 text-xs block text-center w-full underline italic">Back</button>
        </section>
    </main>

    <div id="admin-panel" class="hidden fixed inset-0 bg-[#020617] z-[100] overflow-y-auto p-4">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
                <h1 class="text-xl font-bold text-red-500">ADMIN CONTROL</h1>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="bg-slate-800 px-6 py-2 rounded-xl text-xs font-bold">CLOSE</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-green-400 font-bold mb-4 uppercase text-xs italic">เช็คสลิปเติมเงิน</h3>
                    <div id="admin-topup-requests" class="space-y-4"></div>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-cyan-400 font-bold mb-4 uppercase text-xs italic">เพิ่มสินค้าใหม่</h3>
                    <div class="bg-slate-900 p-5 rounded-2xl space-y-3">
                        <input type="text" id="adm-p-name" placeholder="ชื่อสินค้า" class="w-full p-3 rounded-xl bg-slate-800 text-xs text-white">
                        <input type="number" id="adm-p-price" placeholder="ราคา" class="w-full p-3 rounded-xl bg-slate-800 text-xs text-white">
                        
                        <div class="flex flex-col gap-2">
                            <label class="text-[10px] text-slate-400 uppercase">เลือกรูปสินค้า:</label>
                            <input type="file" id="adm-p-file" accept="image/*" class="text-[10px] text-slate-500">
                            <input type="hidden" id="adm-p-img-url"> </div>

                        <textarea id="adm-p-stock" placeholder="ไอดี:รหัส (1 บรรทัด ต่อ 1 ไอดี)" class="w-full p-3 rounded-xl bg-slate-800 h-24 text-xs text-white"></textarea>
                        <button id="btn-admin-add" onclick="adminAdd()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold text-xs">เพิ่มสินค้าลงร้าน</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-xs border-t-4 border-cyan-500 shadow-2xl">
            <h3 class="text-center font-bold mb-6 uppercase text-cyan-400">Login</h3>
            <input type="text" id="l-user" placeholder="Username" class="w-full p-4 mb-3 rounded-2xl bg-slate-900 text-white text-sm outline-none">
            <input type="password" id="l-pass" placeholder="Password" class="w-full p-4 mb-6 rounded-2xl bg-slate-900 text-white text-sm outline-none">
            <button onclick="login()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold shadow-lg">SIGN IN</button>
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="w-full mt-4 text-slate-500 text-[10px] uppercase underline">Cancel</button>
        </div>
    </div>

    <div id="reg-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-xs border-t-4 border-cyan-500 shadow-2xl">
            <h3 class="text-center font-bold mb-6 uppercase text-cyan-400">Register</h3>
            <input type="text" id="r-user" placeholder="Username" class="w-full p-4 mb-3 rounded-2xl bg-slate-900 text-white text-sm outline-none">
            <input type="password" id="r-pass1" placeholder="Password" class="w-full p-4 mb-3 rounded-2xl bg-slate-900 text-white text-sm outline-none">
            <input type="password" id="r-pass2" placeholder="Confirm Password" class="w-full p-4 mb-6 rounded-2xl bg-slate-900 text-white text-sm outline-none">
            <button onclick="register()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold shadow-lg">CREATE ACCOUNT</button>
            <button onclick="document.getElementById('reg-modal').classList.add('hidden')" class="w-full mt-4 text-slate-500 text-[10px] uppercase underline">Cancel</button>
        </div>
    </div>

    <div id="success-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[400] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-xs text-center border-t-4 border-green-500">
            <h3 class="font-bold mb-2 text-green-400">สำเร็จ! ✅</h3>
            <input type="text" id="acc-out" readonly class="w-full bg-slate-900 p-4 rounded-xl text-cyan-400 font-bold text-center mb-6">
            <button onclick="copyAcc()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold shadow-lg">COPY</button>
            <button onclick="document.getElementById('success-modal').classList.add('hidden')" class="mt-4 text-slate-500 text-xs underline">ปิด</button>
        </div>
    </div>

    <script>
        var firebaseConfig = {
          apiKey: "AIzaSyD9c6XQkaxfimS6z3iIg5dh2filSsZ9fR8",
          authDomain: "apishop-c68d5.firebaseapp.com",
          projectId: "apishop-c68d5",
          storageBucket: "apishop-c68d5.firebasestorage.app",
          messagingSenderId: "1036199268260",
          appId: "1:1036199268260:web:ca385d7ccc7e321296fb31",
          databaseURL: "https://apishop-c68d5-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();
        var IMGBB_API_KEY = "37a72c1c69996d98d40787e997a02c81"; 

        var currentUser = null;

        // ล็อกอินแบบกดปุ๊บเช็คปั๊บ
        window.login = function() {
            var u = document.getElementById('l-user').value.trim();
            var p = document.getElementById('l-pass').value;
            if(!u || !p) return alert('กรอกให้ครบ!');

            if(u === 'Apishop' && p === 'Apishop100955') {
                var k = prompt("Master Key:");
                if(k === "100955") { 
                    document.getElementById('admin-panel').classList.remove('hidden'); 
                    document.getElementById('login-modal').classList.add('hidden'); 
                    return;
                }
            }

            db.ref('users/' + u).once('value', function(snap) {
                var val = snap.val();
                if(val && val.password === p) {
                    currentUser = { ...val, username: u };
                    updateUI();
                    document.getElementById('login-modal').classList.add('hidden');
                } else alert('ชื่อหรือรหัสผ่านผิด');
            });
        };

        window.register = function() {
            var u = document.getElementById('r-user').value.trim();
            var p1 = document.getElementById('r-pass1').value;
            var p2 = document.getElementById('r-pass2').value;
            if(!u || !p1 || p1 !== p2) return alert('ข้อมูลไม่ถูกต้อง');
            db.ref('users/' + u).once('value', function(snap) {
                if(snap.exists()) return alert('ชื่อนี้มีคนใช้แล้ว');
                db.ref('users/' + u).set({ password: p1, balance: 0 }).then(() => {
                    alert('สมัครสำเร็จ!');
                    document.getElementById('reg-modal').classList.add('hidden');
                });
            });
        };

        function updateUI() {
            if(!currentUser) return;
            db.ref('users/' + currentUser.username).on('value', function(snap) {
                var d = snap.val();
                document.getElementById('balance-card').classList.remove('hidden');
                document.getElementById('user-money').innerText = d.balance || 0;
                document.getElementById('user-display-name').innerText = currentUser.username;
                document.getElementById('auth-zone').innerHTML = '<span class="text-cyan-400 font-bold text-xs">' + currentUser.username + '</span><button onclick="location.reload()" class="ml-3 text-red-500 font-bold text-xs uppercase">Logout</button>';
            });
        }

        window.showS = function(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id + '-section').classList.remove('hidden');
            if(id === 'history') renderHistory();
        };

        // ระบบอัปโหลดรูป (ทั้งสลิปและสินค้า)
        async function uploadToImgBB(file) {
            var formData = new FormData();
            formData.append('image', file);
            var res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData });
            var data = await res.json();
            return data.success ? data.data.url : null;
        }

        window.uploadSlip = async function() {
            var file = document.getElementById('slip-file').files[0];
            var amt = document.getElementById('topup-amount').value;
            if(!file || !amt || !currentUser) return alert('กรอกข้อมูลไม่ครบ');
            
            document.getElementById('btn-submit-topup').innerText = "กำลังส่ง...";
            var url = await uploadToImgBB(file);
            if(url) {
                db.ref('topup_requests/' + Date.now()).set({ username: currentUser.username, amount: parseInt(amt), slip: url });
                alert('ส่งสลิปแล้ว');
                showS('home');
            }
            document.getElementById('btn-submit-topup').innerText = "แจ้งโอน";
        };

        window.adminAdd = async function() {
            var n = document.getElementById('adm-p-name').value;
            var p = parseInt(document.getElementById('adm-p-price').value);
            var f = document.getElementById('adm-p-file').files[0];
            var s = document.getElementById('adm-p-stock').value.split('\n').filter(l => l.trim() !== "");

            if(!n || !p || !f || s.length === 0) return alert('กรอกข้อมูลสินค้าให้ครบ!');

            document.getElementById('btn-admin-add').innerText = "กำลังอัปโหลดรูป...";
            var url = await uploadToImgBB(f);
            if(url) {
                db.ref('products/' + Date.now()).set({ name: n, price: p, image: url, stock: s }).then(() => {
                    alert('ลงสินค้าแล้ว!');
                    location.reload();
                });
            }
        };

        db.ref('products').on('value', function(snapshot) {
            var val = snapshot.val();
            var products = val ? Object.keys(val).map(k => ({ ...val[k], id: k })) : [];
            document.getElementById('product-list').innerHTML = products.map(p => {
                return '<div class="glass overflow-hidden rounded-3xl border border-white/5 flex flex-col">' +
                    '<img src="' + p.image + '" class="w-full h-44 object-cover">' +
                    '<div class="p-5 flex flex-col flex-grow">' +
                        '<h3 class="text-white font-bold text-sm mb-1">' + p.name + '</h3>' +
                        '<p class="text-[10px] text-slate-500 mb-4 font-mono">STOCK: ' + (p.stock ? p.stock.length : 0) + '</p>' +
                        '<div class="flex justify-between items-center mt-auto">' +
                            '<span class="text-lg font-bold">' + p.price + ' ฿</span>' +
                            '<button onclick="buyProduct(\'' + p.id + '\')" class="bg-cyan-600 px-6 py-2 rounded-2xl text-[10px] font-bold">Buy Now</button>' +
                    '</div></div></div>';
            }).join('');
        });

        window.buyProduct = function(pId) {
            if(!currentUser) return alert('กรุณาล็อกอิน');
            db.ref('products/' + pId).once('value', function(snap) {
                var p = snap.val();
                db.ref('users/' + currentUser.username).once('value', function(uSnap) {
                    var u = uSnap.val();
                    if(u.balance < p.price) return alert('เงินไม่พอ');
                    var acc = p.stock.shift();
                    var orders = u.orders || [];
                    orders.unshift({ name: p.name, account: acc, date: new Date().toLocaleString() });
                    db.ref('products/' + pId + '/stock').set(p.stock);
                    db.ref('users/' + currentUser.username).update({ balance: u.balance - p.price, orders: orders }).then(() => {
                        document.getElementById('acc-out').value = acc;
                        document.getElementById('success-modal').classList.remove('hidden');
                    });
                });
            });
        };

        function renderHistory() {
            db.ref('users/' + currentUser.username + '/orders').on('value', snap => {
                var o = snap.val() || [];
                document.getElementById('order-history-list').innerHTML = o.map(x => {
                    return '<div class="glass p-5 rounded-3xl border border-white/5 font-mono shadow-xl">' +
                        '<p class="text-[10px] text-slate-500 mb-1">' + x.date + '</p>' +
                        '<h4 class="text-white font-bold text-xs mb-3">' + x.name + '</h4>' +
                        '<div class="p-4 bg-slate-900 rounded-2xl text-cyan-400 text-xs break-all">' + x.account + '</div>' +
                    '</div>';
                }).join('');
            });
        }

        window.approveMoney = function(id, uName, amt) {
            db.ref('users/' + uName + '/balance').once('value', s => {
                db.ref('users/' + uName + '/balance').set((s.val() || 0) + amt);
                db.ref('topup_requests/' + id).remove();
            });
        };

        db.ref('topup_requests').on('value', snap => {
            var v = snap.val();
            var h = '';
            if(v) Object.keys(v).forEach(id => {
                var r = v[id];
                h += '<div class="p-4 bg-slate-900 rounded-2xl border border-white/5 text-xs">' +
                    '<p class="text-cyan-400">' + r.username + ' | ' + r.amount + '฿</p>' +
                    '<img src="' + r.slip + '" class="w-full h-32 object-cover rounded my-2">' +
                    '<button onclick="approveMoney(\''+id+'\', \''+r.username+'\', '+r.amount+')" class="w-full bg-green-600 py-2 rounded font-bold uppercase">ยืนยัน</button></div>';
            });
            document.getElementById('admin-topup-requests').innerHTML = h || 'ไม่มีสลิป';
        });

        window.copyAcc = function() { document.getElementById('acc-out').select(); document.execCommand('copy'); alert('คัดลอกแล้ว'); };
    </script>
</body>
  </html>
