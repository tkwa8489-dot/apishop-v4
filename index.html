<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apishop-v4 | Premium Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { font-family: 'Kanit', sans-serif; box-sizing: border-box; }
        body { background-color: #020617; color: #e2e8f0; margin: 0; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }
        .swal2-popup { border-radius: 2rem !important; background: #0f172a !important; color: #fff !important; border: 1px solid #06b6d4 !important; }
        .logo-img { width: 35px; height: 35px; border-radius: 8px; object-fit: cover; }
    </style>
</head>
<body>

    <nav class="p-4 glass sticky top-0 z-50 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-3" onclick="location.reload()" style="cursor:pointer">
            <img src="https://i.ibb.co/v4S8L8X/4096.png" class="logo-img" alt="Logo">
            <h1 class="text-lg font-bold uppercase tracking-widest text-cyan-400">Apishop</h1>
        </div>
        <div id="auth-zone" class="flex gap-2">
            <button onclick="document.getElementById('login-modal').classList.remove('hidden')" class="text-white px-3 text-[10px] uppercase font-bold">Login</button>
            <button onclick="document.getElementById('reg-modal').classList.remove('hidden')" class="bg-cyan-600 px-4 py-1.5 rounded-full text-[10px] font-bold">Register</button>
        </div>
    </nav>

    <main class="container mx-auto p-4 max-w-6xl">
        <div id="balance-card" class="hidden mb-6 p-5 glass rounded-3xl flex justify-between items-center border-l-4 border-cyan-500 shadow-2xl">
            <div>
                <p class="text-slate-400 text-[10px] uppercase">ยินดีต้อนรับ: <span id="user-display-name" class="text-cyan-400 font-bold"></span></p>
                <h2 class="text-2xl font-bold text-white"><span id="user-money">0</span> <span class="text-cyan-500 text-xs">฿</span></h2>
            </div>
            <div class="flex gap-2">
                <button onclick="showS('history')" class="bg-slate-800 p-2.5 rounded-xl text-[10px]">📜 ประวัติ</button>
                <button onclick="showS('topup')" class="bg-cyan-600 px-4 py-2 rounded-xl text-[10px] font-bold">➕ เติมเงิน</button>
            </div>
        </div>

        <section id="home-section">
            <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </section>

        <section id="topup-section" class="hidden max-w-md mx-auto py-4">
            <div class="glass p-8 rounded-3xl text-center border border-cyan-500/20 shadow-2xl">
                <h2 class="text-xl font-bold mb-6 uppercase text-cyan-400">Topup Money</h2>
                <div class="bg-slate-900 p-4 rounded-2xl mb-6">
                    <p class="text-slate-500 text-[10px] mb-1 italic">โอนเงินมาที่เบอร์นี้</p>
                    <p class="text-xl font-bold text-white tracking-widest">096-998-0396</p>
                </div>
                <div class="text-left space-y-4">
                    <label class="text-[10px] text-slate-500 ml-2">เลือกสลิปที่โอน</label>
                    <input type="file" id="slip-file" accept="image/*" class="w-full text-[10px] text-slate-500">
                    <input type="number" id="topup-amount" placeholder="ระบุจำนวนเงิน" class="w-full p-4 rounded-xl bg-slate-800 text-white outline-none">
                </div>
                <button id="btn-submit-topup" onclick="uploadSlip()" class="w-full mt-8 py-4 rounded-2xl bg-cyan-600 font-bold shadow-lg">ส่งข้อมูลแจ้งโอน</button>
                <button onclick="showS('home')" class="mt-4 text-slate-500 text-[10px] block w-full underline">ยกเลิก</button>
            </div>
        </section>

        <section id="history-section" class="hidden py-4">
            <h2 class="text-xl font-bold mb-6 italic text-cyan-400">Order History</h2>
            <div id="order-history-list" class="space-y-4"></div>
            <button onclick="showS('home')" class="mt-8 text-slate-500 text-[10px] block text-center w-full underline">กลับหน้าหลัก</button>
        </section>
    </main>

    <div id="admin-panel" class="hidden fixed inset-0 bg-[#020617] z-[100] overflow-y-auto p-4">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
                <h1 class="text-xl font-bold text-red-500 uppercase italic">Admin Dashboard</h1>
                <button onclick="document.getElementById('admin-panel').classList.add('hidden')" class="bg-slate-800 px-6 py-2 rounded-xl text-xs font-bold">ปิดหน้าต่าง</button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-green-400 font-bold mb-4 uppercase text-xs italic">เช็คสลิปเติมเงิน</h3>
                    <div id="admin-topup-requests" class="space-y-4"></div>
                </div>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="text-cyan-400 font-bold mb-4 uppercase text-xs italic">จัดการสินค้า</h3>
                    <div class="bg-slate-900 p-5 rounded-2xl space-y-3">
                        <input type="text" id="adm-p-name" placeholder="ชื่อสินค้า" class="w-full p-3 rounded-xl bg-slate-800 text-xs text-white">
                        <input type="number" id="adm-p-price" placeholder="ราคา" class="w-full p-3 rounded-xl bg-slate-800 text-xs text-white">
                        <input type="text" id="adm-p-img" placeholder="ลิงก์รูป (จาก ImgBB หรือเว็บฝากรูป)" class="w-full p-3 rounded-xl bg-slate-800 text-xs text-white">
                        <textarea id="adm-p-stock" placeholder="ไอดี:รหัส (1 บรรทัด ต่อ 1 ไอดี)" class="w-full p-3 rounded-xl bg-slate-800 h-24 text-xs text-white"></textarea>
                        <button onclick="adminAdd()" class="w-full bg-cyan-600 py-3 rounded-xl font-bold text-xs uppercase shadow-lg">เพิ่มเข้าสต็อก</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-xs border-t-4 border-cyan-500">
            <h3 class="text-center font-bold mb-6 text-cyan-400 italic">LOGIN</h3>
            <input type="text" id="l-user" placeholder="Username" class="w-full p-4 mb-3 rounded-2xl bg-slate-900 text-white outline-none">
            <input type="password" id="l-pass" placeholder="Password" class="w-full p-4 mb-6 rounded-2xl bg-slate-900 text-white outline-none">
            <button onclick="login()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold shadow-lg">ยืนยัน</button>
            <button onclick="document.getElementById('login-modal').classList.add('hidden')" class="w-full mt-4 text-slate-500 text-[10px] uppercase underline italic">ยกเลิก</button>
        </div>
    </div>

    <div id="reg-modal" class="hidden fixed inset-0 bg-black/95 flex items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-xs border-t-4 border-cyan-500">
            <h3 class="text-center font-bold mb-6 text-cyan-400 italic">REGISTER</h3>
            <input type="text" id="r-user" placeholder="Username" class="w-full p-4 mb-3 rounded-2xl bg-slate-900 text-white outline-none">
            <input type="password" id="r-pass1" placeholder="Password" class="w-full p-4 mb-3 rounded-2xl bg-slate-900 text-white outline-none">
            <input type="password" id="r-pass2" placeholder="Confirm Password" class="w-full p-4 mb-6 rounded-2xl bg-slate-900 text-white outline-none">
            <button onclick="register()" class="w-full bg-cyan-600 py-4 rounded-2xl font-bold shadow-lg">สมัครสมาชิก</button>
            <button onclick="document.getElementById('reg-modal').classList.add('hidden')" class="w-full mt-4 text-slate-500 text-[10px] uppercase underline italic">ยกเลิก</button>
        </div>
    </div>

    <script>
        var firebaseConfig = {
          apiKey: "AIzaSyD9c6XQkaxfimS6z3iIg5dh2filSsZ9fR8",
          authDomain: "apishop-c68d5.firebaseapp.com",
          projectId: "apishop-c68d5",
          storageBucket: "apishop-c68d5.firebasestorage.app",
          messagingSenderId: "1036199268260",
          appId: "1:1036199268260:web:ca385d7ccc7e321296fb31",
          databaseURL: "https://apishop-c68d5-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        var db = firebase.database();
        var IMGBB_API_KEY = "37a72c1c69996d98d40787e997a02c81"; 

        var currentUser = null;

        // ดึงข้อมูลสินค้ามาแสดงผล
        db.ref('products').on('value', function(snapshot) {
            var val = snapshot.val();
            var products = val ? Object.keys(val).map(function(k) { return { ...val[k], id: k }; }) : [];
            renderP(products);
        });

        window.login = function() {
            var u = document.getElementById('l-user').value.trim();
            var p = document.getElementById('l-pass').value;
            if(!u || !p) return;

            if(u === 'Apishop' && p === 'Apishop100955') {
                var k = prompt("Master Key:");
                if(k === "100955") { 
                    Swal.fire({ icon: 'success', title: 'Apishop Admin', text: 'ยินดีต้อนรับท่านมาสเตอร์!', showConfirmButton: false, timer: 1500 });
                    document.getElementById('admin-panel').classList.remove('hidden'); 
                    document.getElementById('login-modal').classList.add('hidden'); 
                    return; 
                }
            }

            db.ref('users/' + u).once('value', function(snapshot) {
                var userData = snapshot.val();
                if(userData && userData.password === p) {
                    currentUser = { ...userData, username: u };
                    updateUI();
                    document.getElementById('login-modal').classList.add('hidden');
                    Swal.fire({ icon: 'success', title: 'Apishop ยินดีต้อนรับ', text: 'สวัสดีคุณ ' + u, showConfirmButton: false, timer: 1500 });
                } else {
                    Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: 'รหัสผิดหรือชื่อไม่มีในระบบ' });
                }
            });
        };

        window.register = function() {
            var u = document.getElementById('r-user').value.trim();
            var p1 = document.getElementById('r-pass1').value;
            var p2 = document.getElementById('r-pass2').value;
            if(!u || !p1 || p1 !== p2) return;
            
            db.ref('users/' + u).once('value', function(snapshot) {
                if(snapshot.exists()) return Swal.fire({ icon: 'warning', title: 'มีชื่อนี้แล้ว', text: 'รบกวนใช้ชื่ออื่นนะไอเสือ' });
                db.ref('users/' + u).set({ password: p1, balance: 0, orders: [] }).then(function() {
                    Swal.fire({ icon: 'success', title: 'สมัครสำเร็จ!', text: 'ล็อกอินเข้าใช้งานได้เลย' });
                    document.getElementById('reg-modal').classList.add('hidden');
                });
            });
        };

        function updateUI() {
            if(!currentUser) return;
            db.ref('users/' + currentUser.username).on('value', function(snap) {
                var data = snap.val();
                if(data) {
                    document.getElementById('balance-card').classList.remove('hidden');
                    document.getElementById('user-money').innerText = data.balance || 0;
                    document.getElementById('user-display-name').innerText = currentUser.username;
                    document.getElementById('auth-zone').innerHTML = '<span class="text-cyan-400 font-bold text-xs">' + currentUser.username + '</span><button onclick="location.reload()" class="ml-3 text-red-500 text-[10px] font-bold">Logout</button>';
                }
            });
        }

        window.showS = function(id) {
            document.getElementById('home-section').classList.add('hidden');
            document.getElementById('topup-section').classList.add('hidden');
            document.getElementById('history-section').classList.add('hidden');
            document.getElementById(id + '-section').classList.remove('hidden');
            if(id === 'history' && currentUser) renderHistory();
        };

        window.uploadSlip = function() {
            if(!currentUser) return Swal.fire('กรุณาล็อกอินก่อน');
            var fileInput = document.getElementById('slip-file');
            var amountInput = document.getElementById('topup-amount');
            if(!fileInput.files[0] || !amountInput.value) return Swal.fire('กรอกข้อมูลให้ครบ');
            
            Swal.fire({ title: 'กำลังอัปโหลดสลิป...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            var formData = new FormData();
            formData.append('image', fileInput.files[0]);
            fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, { method: 'POST', body: formData })
            .then(res => res.json()).then(data => {
                if(data.success) {
                    db.ref('topup_requests/' + Date.now()).set({ username: currentUser.username, amount: parseInt(amountInput.value), slip: data.data.url, date: new Date().toLocaleString() });
                    Swal.fire({ icon: 'success', title: 'ส่งสลิปสำเร็จ!', text: 'รอแอดมินเช็คยอดสักครู่ครับ' });
                    showS('home');
                } else { Swal.fire('เกิดข้อผิดพลาดในการอัปโหลด'); }
            });
        };

        function renderP(products) {
            document.getElementById('product-list').innerHTML = products.map(function(p) {
                return '<div class="glass overflow-hidden rounded-3xl border border-white/5 flex flex-col shadow-2xl">' +
                    '<img src="' + (p.image || '') + '" class="w-full h-44 border-b border-white/5" onerror="this.src=\'https://i.ibb.co/v4S8L8X/4096.png\'">' +
                    '<div class="p-5 flex flex-col justify-between flex-grow">' +
                        '<div><h3 class="text-white font-bold text-sm mb-1">' + p.name + '</h3>' +
                        '<p class="text-[10px] text-slate-500 mb-4 font-mono">คงเหลือ: ' + (p.stock ? p.stock.length : 0) + ' ชิ้น</p></div>' +
                        '<div class="flex justify-between items-center mt-auto">' +
                            '<span class="text-lg font-bold text-white">' + p.price + ' ฿</span>' +
                            '<button onclick="buyProduct(\'' + p.id + '\')" class="bg-cyan-600 px-6 py-2 rounded-2xl text-[10px] font-bold shadow-lg shadow-cyan-500/20">Buy Now</button>' +
                    '</div></div></div>';
            }).join('');
        }

        window.adminAdd = function() {
            var n = document.getElementById('adm-p-name').value;
            var p = parseInt(document.getElementById('adm-p-price').value);
            var i = document.getElementById('adm-p-img').value;
            var s = document.getElementById('adm-p-stock').value.split('\n').filter(l => l.trim() !== "");
            if(n && p && i && s.length > 0) {
                db.ref('products/' + Date.now()).set({ name: n, price: p, image: i, stock: s }).then(() => {
                    Swal.fire('เพิ่มสินค้าสำเร็จ!', 'ลงสต็อกเรียบร้อยแล้ว', 'success');
                    document.getElementById('adm-p-name').value = '';
                    document.getElementById('adm-p-price').value = '';
                    document.getElementById('adm-p-img').value = '';
                    document.getElementById('adm-p-stock').value = '';
                });
            } else { Swal.fire('ข้อมูลไม่ครบ', 'ใส่ชื่อ ราคา รูป และสต็อกด้วยนะ', 'error'); }
        };

        window.buyProduct = function(pId) {
            if(!currentUser) return Swal.fire('กรุณาล็อกอินก่อนซื้อนะครับ');
            db.ref('products/' + pId).once('value', function(snap) {
                var p = snap.val();
                if(!p || !p.stock || p.stock.length === 0) return Swal.fire('สินค้าหมด', 'ตัวนี้หมดแล้วครับ รอแอดมินมาเติมนะ', 'warning');
                
                db.ref('users/' + currentUser.username).once('value', function(userSnap) {
                    var userData = userSnap.val();
                    if(userData.balance < p.price) return Swal.fire('เงินไม่พอ', 'กรุณาเติมเงินเข้าระบบก่อนซื้อนะครับ', 'error');
                    
                    Swal.fire({
                        title: 'ยืนยันการซื้อ?',
                        text: "คุณต้องการซื้อ " + p.name + " ใช่หรือไม่?",
                        icon: 'question',
                        showCancelButton: true,
                        confirmButtonText: 'ใช่, ซื้อเลย!',
                        cancelButtonText: 'ยกเลิก'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            var acc = p.stock.shift();
                            var newBalance = userData.balance - p.price;
                            var orders = userData.orders || [];
                            orders.unshift({ name: p.name, account: acc, date: new Date().toLocaleString() });

                            db.ref('products/' + pId + '/stock').set(p.stock);
                            db.ref('users/' + currentUser.username).update({ balance: newBalance, orders: orders }).then(() => {
                                Swal.fire({
                                    title: 'ซื้อสำเร็จ! ✅',
                                    html: '<p style="font-size:12px; color:#94a3b8;">นี่คือไอดีของคุณลูกค้า Apishop ขอขอบคุณครับ</p>' +
                                          '<div id="copy-target" style="background:#020617; color:#06b6d4; padding:15px; border-radius:12px; margin-top:15px; font-family:monospace; font-weight:bold; border:1px solid #06b6d4; word-break:break-all;">' + acc + '</div>',
                                    showCancelButton: true,
                                    confirmButtonText: 'คัดลอกรหัส',
                                    cancelButtonText: 'ปิด'
                                }).then((res) => {
                                    if(res.isConfirmed) {
                                        navigator.clipboard.writeText(acc);
                                        Swal.fire('คัดลอกแล้ว!', '', 'success');
                                    }
                                });
                            });
                        }
                    });
                });
            });
        };

        function renderHistory() {
            db.ref('users/' + currentUser.username + '/orders').on('value', function(snap) {
                var orders = snap.val() || [];
                document.getElementById('order-history-list').innerHTML = orders.map(o => {
                    return '<div class="glass p-5 rounded-3xl border border-white/5 font-mono shadow-xl">' +
                        '<div class="flex justify-between items-center mb-1 text-[10px] text-slate-500 italic"><span>' + o.date + '</span><span class="text-green-500">PAID</span></div>' +
                        '<h4 class="text-white font-bold text-xs mb-3">' + o.name + '</h4>' +
                        '<div class="p-4 bg-slate-900
